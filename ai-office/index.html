<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가상 사무실 — 작업실 컴퍼니</title>
<style>
  :root {
    --bg: #f4f1ea;
    --panel: #ffffff;
    --ink: #2b2a28;
    --sub: #6b6a66;
    --line: #e4dfd3;
    --floor-a: #ece6d6;
    --floor-b: #e4ddc9;
    --accent: #D9A441;
    --shadow: 0 2px 10px rgba(40,30,10,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #26241f;
      --ink: #ece7db;
      --sub: #a8a294;
      --line: #3a382f;
      --floor-a: #2b291f;
      --floor-b: #262418;
      --shadow: 0 2px 14px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px;
  }
  header.page {
    max-width: 1100px;
    margin: 0 auto 18px;
  }
  header.page h1 { margin: 0 0 4px; font-size: 22px; }
  header.page p { margin: 0; color: var(--sub); font-size: 13.5px; }

  .layout {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 18px;
  }
  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
  }

  /* ---- Office scene ---- */
  #office {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    background:
      repeating-linear-gradient(90deg, var(--floor-a) 0 40px, var(--floor-b) 40px 80px);
  }
  .desk {
    position: absolute;
    width: 64px;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  .desk .icon { font-size: 22px; }
  .desk .cap {
    font-size: 10px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1px 5px;
    display: inline-block;
    margin-top: 2px;
    opacity: .85;
  }
  .table-meeting {
    position: absolute;
    left: 50%; top: 48%;
    width: 90px; height: 56px;
    transform: translate(-50%, -50%);
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 50%;
    opacity: .7;
  }

  .character {
    position: absolute;
    width: 42px;
    transform: translate(-50%, -100%);
    transition: left 2.6s cubic-bezier(.4,0,.2,1), top 2.6s cubic-bezier(.4,0,.2,1);
    z-index: 5;
    cursor: pointer;
  }
  .character .rig { transition: transform .2s; }
  .character.flip .rig { transform: scaleX(-1); }
  .character.walking .rig { animation: bob .35s infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
  .character.flip.walking .rig { animation: bobflip .35s infinite alternate; }
  @keyframes bobflip { from { transform: scaleX(-1) translateY(0); } to { transform: scaleX(-1) translateY(-3px); } }

  .character .head {
    width: 20px; height: 20px; border-radius: 50%;
    margin: 0 auto;
    background: var(--c);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .character .body {
    width: 26px; height: 26px; border-radius: 9px;
    background: var(--c);
    margin: 3px auto 0;
    opacity: .82;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .character .name {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    margin-top: 3px;
    color: var(--ink);
    text-shadow: 0 1px 2px var(--bg), 0 -1px 2px var(--bg);
  }
  .bubble {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translate(-50%, -6px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 9px;
    font-size: 11px;
    line-height: 1.35;
    width: 168px;
    color: var(--ink);
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 20;
  }
  .bubble.below {
    bottom: auto;
    top: 100%;
    transform: translate(-50%, 6px);
  }
  .bubble.show { opacity: 1; }
  .bubble b { color: var(--c); }

  /* ---- Sidebar ---- */
  .side { display: flex; flex-direction: column; gap: 18px; }
  .card .card-title {
    font-size: 13px;
    font-weight: 700;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--sub);
    letter-spacing: .02em;
  }
  .roster { padding: 8px 10px; }
  .roster-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 7px 6px; border-radius: 8px;
  }
  .roster-row:hover { background: var(--bg); }
  .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex: none; }
  .roster-row .who { font-size: 12.5px; font-weight: 700; }
  .roster-row .who span { font-weight: 400; color: var(--sub); margin-left: 4px; }
  .roster-row .task { font-size: 11.5px; color: var(--sub); margin-top: 1px; }

  .cand-list, .log-list { padding: 6px 14px 14px; }
  .cand-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--line);
    gap: 8px;
  }
  .cand-row:last-child { border-bottom: none; }
  .badge {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
    color: white; white-space: nowrap; flex: none;
  }
  .log-item { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .log-item:last-child { border-bottom: none; }
  .log-item .date { font-size: 10.5px; color: var(--sub); }
  .log-item .title { font-size: 12.5px; font-weight: 700; margin: 2px 0 3px; }
  .log-item .summary { font-size: 11.5px; color: var(--sub); line-height: 1.5; }

  footer.page {
    max-width: 1100px; margin: 18px auto 0;
    font-size: 11.5px; color: var(--sub); text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

<header class="page">
  <h1>🏢 가상 사무실 <span id="hdr-company"></span></h1>
  <p id="hdr-tagline"></p>
</header>

<div class="layout">
  <div class="card" style="padding:12px;">
    <div id="office">
      <!-- desks + characters injected by JS -->
    </div>
  </div>

  <div class="side">
    <div class="card">
      <div class="card-title">직원 명부</div>
      <div class="roster" id="roster"></div>
    </div>
    <div class="card">
      <div class="card-title">사업 후보 현황</div>
      <div class="cand-list" id="cand-list"></div>
    </div>
    <div class="card">
      <div class="card-title">최근 결정 로그</div>
      <div class="log-list" id="log-list"></div>
    </div>
  </div>
</div>

<footer class="page">
  이 화면은 실시간 중계가 아니라, 사장(정연)이 회사에 변화가 있을 때마다 갱신하는 상태 스냅샷입니다(registry.js와 같은 패턴).<br>
  전체 논의 기록은 저장소의 <code>company/</code> 폴더 참고 · 마지막 갱신: <span id="hdr-updated"></span>
</footer>

<script src="status.js"></script>
<script>
(function () {
  const DATA = window.OFFICE_STATUS;
  const office = document.getElementById('office');

  document.getElementById('hdr-company').textContent = '— ' + DATA.companyName;
  document.getElementById('hdr-tagline').textContent = DATA.tagline;
  document.getElementById('hdr-updated').textContent = DATA.updatedAt;

  // Fixed desk layout (percent coords within #office)
  const DESKS = {
    'desk-ceo': { x: 18, y: 24, label: '사장실' },
    'desk-cso': { x: 82, y: 24, label: '전략팀' },
    'desk-cto': { x: 18, y: 78, label: '기술팀' },
    'desk-cmo': { x: 82, y: 78, label: '그로스팀' }
  };

  // Render desks + meeting table
  Object.entries(DESKS).forEach(([id, d]) => {
    const el = document.createElement('div');
    el.className = 'desk';
    el.style.left = d.x + '%';
    el.style.top = d.y + '%';
    el.innerHTML = `<div class="icon">🖥️</div><div class="cap">${d.label}</div>`;
    office.appendChild(el);
  });
  const table = document.createElement('div');
  table.className = 'table-meeting';
  office.appendChild(table);

  // Render roster sidebar
  const rosterEl = document.getElementById('roster');
  DATA.staff.forEach(s => {
    const row = document.createElement('div');
    row.className = 'roster-row';
    row.innerHTML = `
      <div class="dot" style="background:${s.color}"></div>
      <div>
        <div class="who">${s.icon} ${s.name} <span>${s.roleLabel}</span></div>
        <div class="task">${s.task}</div>
      </div>`;
    rosterEl.appendChild(row);
  });

  // Render candidates
  const candEl = document.getElementById('cand-list');
  (DATA.candidates || []).forEach(c => {
    const row = document.createElement('div');
    row.className = 'cand-row';
    row.innerHTML = `<span>${c.name}</span><span class="badge" style="background:${c.statusColor}">${c.status}</span>`;
    candEl.appendChild(row);
  });

  // Render recent log
  const logEl = document.getElementById('log-list');
  (DATA.recentLog || []).forEach(l => {
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `<div class="date">${l.date}</div><div class="title">${l.title}</div><div class="summary">${l.summary}</div>`;
    logEl.appendChild(item);
  });

  // ---- Characters & walking animation ----
  const chars = DATA.staff.map(s => {
    const desk = DESKS[s.deskId] || { x: 50, y: 50 };
    const el = document.createElement('div');
    el.className = 'character';
    el.style.setProperty('--c', s.color);
    el.style.left = desk.x + '%';
    el.style.top = desk.y + '%';
    const bubbleBelow = desk.y < 50;
    el.innerHTML = `
      <div class="bubble${bubbleBelow ? ' below' : ''}"><b>${s.name}</b> — ${s.task}</div>
      <div class="rig">
        <div class="head">${s.icon}</div>
        <div class="body"></div>
      </div>
      <div class="name">${s.name}</div>`;
    office.appendChild(el);
    return { data: s, el, x: desk.x, y: desk.y, home: desk, bubbleEl: el.querySelector('.bubble') };
  });

  function moveTo(c, x, y) {
    const flip = x < c.x;
    c.el.classList.toggle('flip', flip);
    c.el.classList.add('walking');
    c.el.style.left = x + '%';
    c.el.style.top = y + '%';
    c.x = x; c.y = y;
    clearTimeout(c._walkTimer);
    c._walkTimer = setTimeout(() => c.el.classList.remove('walking'), 2600);
  }

  function randNear(base, spread, min, max) {
    const v = base + (Math.random() * 2 - 1) * spread;
    return Math.max(min, Math.min(max, v));
  }

  // Ambient wandering: each character occasionally strolls near its own desk
  function wanderTick() {
    chars.forEach(c => {
      if (Math.random() < 0.7) {
        const x = randNear(c.home.x, 16, 10, 90);
        const y = randNear(c.home.y, 14, 14, 88);
        moveTo(c, x, y);
      }
    });
  }

  // Periodic "board meeting": everyone converges to the table, then disperses
  function meetingTick() {
    chars.forEach((c, i) => {
      const angle = (Math.PI * 2 * i) / chars.length;
      const x = 50 + Math.cos(angle) * 13;
      const y = 48 + Math.sin(angle) * 13;
      moveTo(c, x, y);
    });
    setTimeout(() => {
      chars.forEach(c => moveTo(c, randNear(c.home.x, 10, 10, 90), randNear(c.home.y, 10, 14, 88)));
    }, 7000);
  }

  setInterval(wanderTick, 5200);
  setTimeout(() => { setInterval(meetingTick, 34000); }, 12000);

  // Speech bubble cycle — show each staff member's current task in turn
  let bIdx = 0;
  function bubbleTick() {
    chars.forEach(c => c.bubbleEl.classList.remove('show'));
    const c = chars[bIdx % chars.length];
    c.bubbleEl.classList.add('show');
    setTimeout(() => c.bubbleEl.classList.remove('show'), 3600);
    bIdx++;
  }
  setInterval(bubbleTick, 4600);
  bubbleTick();

  // Click a character to show its bubble on demand
  chars.forEach(c => {
    c.el.addEventListener('click', () => {
      chars.forEach(o => o.bubbleEl.classList.remove('show'));
      c.bubbleEl.classList.add('show');
      setTimeout(() => c.bubbleEl.classList.remove('show'), 4000);
    });
  });
})();
</script>

</body>
</html>
