name = "glowhalo3-watchdog"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# GlowHalo 3 시장 워치독 — 무료 티어(workers.dev 서브도메인) 배포.
# Phase 0(페이퍼)에서는 업비트 공개 API만 사용하므로 시크릿이 전혀 없다.
# Phase 1(실거래)에서 거래소 API 키가 생기면 여기 두지 않고
# `npx wrangler secret put ...`으로 주입한다 (금고 tossneon-api-vault 경유).

# KV 네임스페이스 ID는 비밀 아님 — 계정 API 토큰 없이는 무용지물이라 커밋해도 안전
# (glowhalo-hq/worker/wrangler.toml과 같은 이유).
kv_namespaces = [
  { binding = "WATCH_KV", id = "0116675324b5453a88474a1d506d575d" }
]

[triggers]
# 5분 주기 시장 점검 (MODE.md §5 2층 워치독)
crons = ["*/5 * * * *"]
