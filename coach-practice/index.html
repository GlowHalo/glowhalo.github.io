<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>코칭연습실</title>
<meta name="description" content="AI가 가상 고객이 되어주는 코칭 실기 연습 도구. KAC/KPC/KSC 대비, 부담 없이 몇 번이고 반복 연습." />
<meta name="theme-color" content="#1E2D4A" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root {
    --navy:#1E2D4A; --navy-deep:#16223A; --terracotta:#E0785A; --terracotta-deep:#C85F42;
    --cream:#F6EFE4; --bg:#F1EBDE; --surface:#FFFFFF; --border:#E4DCC9;
    --text:#232B3A; --muted:#8A8C97; --good:#3F7D5C; --mid:#C08A2E; --bad:#B85347;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); font-family:'Noto Sans KR',sans-serif; display:flex; justify-content:center; color:var(--text); }
  .serif { font-family:'Gowun Batang', serif; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  .app { width:100%; max-width:460px; min-height:100vh; background:var(--surface); box-shadow:0 0 40px rgba(0,0,0,0.08); display:flex; flex-direction:column; position:relative; }

  /* ---------- 헤더 공통 ---------- */
  .topbar { background:var(--navy); color:var(--cream); padding:20px 20px 14px; position:relative; }
  .topbar .tag { font-size:10px; letter-spacing:.2em; color:#B9C3D6; margin:0; }
  .topbar h1 { font-size:21px; margin:4px 0 0; color:#fff; }
  .topbar .sub { font-size:11px; color:#B9C3D6; margin:6px 0 0; line-height:1.6; }
  .gearbtn {
    position:absolute; top:16px; right:16px; width:32px; height:32px; border-radius:50%;
    border:1px solid rgba(255,255,255,0.25); background:rgba(255,255,255,0.08); color:#fff; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .gearbtn:hover { background:rgba(255,255,255,0.18); }
  .ai-status-row { margin:10px 0 0; font-size:10px; color:#B9C3D6; display:flex; align-items:center; gap:6px; }
  .ai-status-row .linklike {
    color:var(--terracotta); text-decoration:none; font-weight:700; background:none; border:none; padding:0;
    font-size:10px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .ai-status-row .linklike:hover { text-decoration:underline; }
  .backbtn { background:none; border:none; color:#B9C3D6; font-size:12px; cursor:pointer; padding:0 0 8px; font-family:'Noto Sans KR',sans-serif; }
  .backbtn:hover { color:#fff; }

  /* ---------- 면책 배너 ---------- */
  .disclaimer {
    margin:14px 20px 0; padding:12px 14px; background:#FBF0EE; border:1px solid #EAC9C1; border-radius:12px;
    font-size:11px; line-height:1.7; color:#7A3B2E;
  }
  .disclaimer b { color:#5E2A20; }

  /* ---------- 등급 선택 화면 ---------- */
  .screen { flex:1; display:flex; flex-direction:column; overflow-y:auto; }
  .grade-list { padding:18px 20px 24px; display:flex; flex-direction:column; gap:12px; }
  .grade-card {
    text-align:left; border:1px solid var(--border); border-radius:16px; padding:16px 18px; background:var(--surface);
    cursor:pointer; font-family:'Noto Sans KR',sans-serif; display:flex; flex-direction:column; gap:6px;
  }
  .grade-card:hover { border-color:var(--terracotta); background:#FFFAF6; }
  .grade-card .glabel { font-family:'Gowun Batang',serif; font-size:19px; color:var(--navy); }
  .grade-card .gdesc { font-size:12px; color:#5B5B63; line-height:1.6; }
  .grade-card .gmeta { font-size:10px; color:var(--muted); margin-top:2px; }

  /* ---------- 시나리오/페르소나 선택 화면 ---------- */
  .section-title { font-size:12px; font-weight:700; color:var(--navy); margin:20px 20px 10px; display:flex; align-items:center; gap:6px; }
  .scenario-list { padding:0 20px; display:flex; flex-direction:column; gap:10px; }
  .scenario-card {
    text-align:left; border:1.5px solid var(--border); border-radius:14px; padding:13px 14px; background:var(--surface);
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .scenario-card.selected { border-color:var(--terracotta); background:#FFF6F1; }
  .scenario-card .stitle { font-size:14px; font-weight:700; color:var(--navy); }
  .scenario-card .sprofile { font-size:11px; color:var(--muted); margin-top:2px; }
  .scenario-card .ssituation { font-size:12px; color:#5B5B63; margin-top:6px; line-height:1.6; }

  .persona-chips { padding:0 20px; display:flex; flex-wrap:wrap; gap:8px; }
  .persona-chip {
    border:1.5px solid var(--border); border-radius:999px; padding:8px 14px; font-size:12px; background:var(--surface);
    cursor:pointer; font-family:'Noto Sans KR',sans-serif; color:#5B5B63;
  }
  .persona-chip.selected { border-color:var(--navy); background:var(--navy); color:#fff; }

  .setup-actions { padding:20px; display:flex; flex-direction:column; gap:10px; margin-top:auto; }
  .btn-primary {
    border:none; border-radius:999px; padding:14px; background:var(--terracotta); color:#fff; font-size:14px; font-weight:700;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .btn-primary:hover { background:var(--terracotta-deep); }
  .btn-primary:disabled { background:#DDD7C8; color:#A8A296; cursor:not-allowed; }
  .btn-secondary {
    border:1.5px solid var(--navy); border-radius:999px; padding:12px; background:#fff; color:var(--navy); font-size:13px; font-weight:600;
    cursor:pointer; font-family:'Noto Sans KR',sans-serif;
  }
  .btn-secondary:hover { background:#F1EBDE; }

  /* ---------- 대화 화면 ---------- */
  .chat-header { padding:0; }
  .chat-meta { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .chat-meta .badge { font-size:10px; padding:3px 9px; border-radius:999px; background:rgba(255,255,255,0.12); color:#fff; }
  .endsession-btn { margin-top:12px; border:1px solid rgba(255,255,255,0.35); background:transparent; color:#fff; font-size:11px; padding:6px 12px; border-radius:999px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .endsession-btn:hover { background:rgba(255,255,255,0.12); }

  .content { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; }
  .row.coach { justify-content:flex-end; }
  .row.client { justify-content:flex-start; }
  .bubble-wrap { max-width:82%; }
  .rolelabel { font-size:9px; font-weight:700; letter-spacing:.05em; color:var(--muted); margin:0 0 4px 4px; }
  .row.coach .rolelabel { text-align:right; margin:0 4px 4px 0; }
  .bubble { border-radius:16px; padding:11px 14px; font-size:14px; line-height:1.6; }
  .bubble.coach { background:var(--navy); color:#fff; border-top-right-radius:4px; }
  .bubble.client { background:var(--cream); color:var(--text); border:1px solid #EAE0CB; border-top-left-radius:4px; }
  .bubble.error { background:#FBF0EE; color:#8A3B2E; border:1px solid #E9C9C1; }
  .typing { display:flex; gap:4px; padding:4px 2px; }
  .typing span { width:6px; height:6px; border-radius:50%; background:var(--terracotta); opacity:.5; animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:.2s; }
  .typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }

  .nudge { text-align:center; font-size:11px; color:var(--muted); padding:2px 20px 4px; }

  .inputbar { padding:8px 16px 16px; border-top:1px solid var(--border); }
  .inputwrap { display:flex; align-items:center; gap:8px; border-radius:999px; padding:6px 6px 6px 16px; background:#fff; border:1px solid var(--border); }
  .inputwrap input { flex:1; border:none; outline:none; font-size:14px; padding:8px 0; color:var(--text); background:transparent; font-family:'Noto Sans KR',sans-serif; }
  .inputwrap input:disabled { color:var(--muted); }
  .sendbtn { width:36px; height:36px; border-radius:999px; border:none; display:flex; align-items:center; justify-content:center; background:#E4DCC9; color:#fff; cursor:pointer; flex-shrink:0; }
  .sendbtn.active { background:var(--terracotta); cursor:pointer; }
  .sendbtn:disabled { cursor:not-allowed; }
  .retrybar { padding:0 20px 16px; text-align:center; }
  .retrybtn { border:1px solid var(--navy); background:#fff; color:var(--navy); font-size:12px; padding:8px 16px; border-radius:999px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .retrybar p { margin:0 0 10px; font-size:12px; color:#5B5B63; }

  /* ---------- 피드백 화면 ---------- */
  .feedback-wrap { padding:18px 20px 28px; display:flex; flex-direction:column; gap:18px; }
  .fb-overall { background:var(--navy); color:#fff; border-radius:16px; padding:18px; }
  .fb-overall .flabel { font-size:10px; letter-spacing:.15em; color:#B9C3D6; margin:0 0 6px; }
  .fb-overall p { margin:0; font-size:14px; line-height:1.7; }
  .fb-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .fb-comp { border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:#fff; }
  .fb-comp .clabel { font-size:11px; color:#5B5B63; margin:0 0 4px; }
  .fb-comp .cval { font-size:13px; font-weight:700; }
  .fb-comp .cval.상 { color:var(--good); }
  .fb-comp .cval.중 { color:var(--mid); }
  .fb-comp .cval.하 { color:var(--bad); }
  .fb-list-title { font-size:12px; font-weight:700; color:var(--navy); margin:4px 0 2px; }
  .fb-list { margin:0; padding-left:18px; font-size:12.5px; line-height:1.8; color:#3D3D42; }
  .fb-turns { display:flex; flex-direction:column; gap:10px; }
  .fb-turn { border:1px solid var(--border); border-radius:12px; padding:10px 12px; background:#fff; }
  .fb-turn .fquote { font-size:12.5px; color:var(--navy); font-weight:600; margin:0 0 4px; }
  .fb-turn .fcomment { font-size:12px; color:#5B5B63; margin:0; line-height:1.6; }
  .fb-turn .fflag { margin-top:6px; font-size:11px; color:var(--bad); background:#FBF0EE; border-radius:8px; padding:5px 8px; }
  .fb-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; }
  .fb-tag { font-size:9px; background:#F1EBDE; color:#5B5B63; padding:2px 7px; border-radius:999px; }
  .fb-actions { display:flex; flex-direction:column; gap:10px; }

  /* ---------- BYOK 설정 모달 ---------- */
  .modal-backdrop {
    display:none; position:fixed; inset:0; z-index:60; background:rgba(22,34,58,0.5);
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.open { display:flex; }
  .modal-card {
    background:#fff; color:var(--navy); border-radius:16px; width:min(380px,100%);
    box-shadow:0 20px 60px rgba(0,0,0,0.25); border:1px solid var(--border); max-height:88vh; overflow-y:auto;
  }
  .modal-head { padding:20px 20px 0; font-size:16px; font-weight:700; font-family:'Gowun Batang',serif; }
  .modal-body { padding:10px 20px 4px; font-size:12px; line-height:1.7; color:#5B5B63; }
  .modal-body p { margin:0 0 10px; }
  .modal-actions { display:flex; gap:8px; padding:16px 20px 20px; }
  .modal-btn {
    flex:1; border:none; cursor:pointer; font-family:'Noto Sans KR',sans-serif; font-size:12px;
    font-weight:600; border-radius:999px; padding:9px 12px; background:#E4DCC9; color:#5B5B63;
  }
  .modal-btn:hover { background:#DCD2B9; }
  .modal-btn.primary { background:var(--navy); color:#fff; }
  .modal-btn.primary:hover { background:var(--navy-deep); }
  .ai-key-input {
    width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid var(--border); border-radius:10px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; outline:none; background:#fff; color:var(--navy);
  }
  .ai-key-input:focus { border-color:var(--terracotta); }
  .ai-note { font-size:11px; color:var(--muted); margin-top:8px; line-height:1.6; }
  .ai-note a { color:var(--terracotta); text-decoration:none; font-weight:700; }
  .ai-note a:hover { text-decoration:underline; }
  .modal-disclaimer { margin:14px 20px 0; padding:11px 12px; background:#FBF0EE; border:1px solid #EAC9C1; border-radius:10px; font-size:10.5px; line-height:1.6; color:#7A3B2E; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="modal-backdrop" id="ai-settings-modal">
  <div class="modal-card">
    <div class="modal-head">⚙️ 내 Gemini API 키</div>
    <div class="modal-body">
      <p>키를 넣으면 체험 횟수 제한 없이 연습할 수 있어요. 키는 이 브라우저의 localStorage에만 저장되고 우리 서버로는 전송되지 않아요 — 대화·피드백 요청도 브라우저에서 Google API로 바로 나가요.</p>
      <input type="text" id="ai-key-input" class="ai-key-input" placeholder="AIza... 로 시작하는 키" autocomplete="off" spellcheck="false" />
      <div class="ai-note"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료 Gemini API 키 발급받기 →</a></div>
    </div>
    <div class="modal-disclaimer">
      이 연습은 한국코치협회(KCA) 공식 코칭실습시간으로 인정되지 않으며, 이 앱은 한국코치협회와 무관한 비공식 서비스입니다.
    </div>
    <div class="modal-actions">
      <button class="modal-btn" id="ai-key-clear">키 지우기</button>
      <button class="modal-btn" id="ai-key-cancel">취소</button>
      <button class="modal-btn primary" id="ai-key-save">저장</button>
    </div>
  </div>
</div>

<script>
/* =========================================================================
   시나리오 · 페르소나 데이터 — worker/index.ts의 GRADE_DATA와 반드시 내용을 맞춰 유지한다.
   BYOK로 브라우저가 직접 Gemini를 호출하든, 체험으로 Worker를 거치든 같은 고객이 나와야 한다.
   ========================================================================= */
const GRADE_DATA = {
  kac: {
    label: "KAC", name: "KAC 대비",
    tagline: "비교적 명확한 상황 — 이직 고민, 워라밸 등",
    difficultyNote: "KAC 단계 고객답게 비교적 명확한 상황을 다룹니다. 코치가 기본적인 경청·열린 질문만 잘 해도 5~8번 정도의 좋은 질문 안에 스스로 알아차림에 조금씩 다가갈 수 있어야 합니다. 다만 그냥 술술 답을 내주지는 말고, 성격 특징만큼의 저항은 유지하세요.",
    scenarios: [
      { id:"career-change", title:"이직 고민", profile:"이서준 (29세, IT기업 백엔드 개발자 3년차)",
        situation:"최근 헤드헌터로부터 조건 좋은 이직 제안을 받았다. 지금 회사에도 정이 들고 팀도 좋아서 계속 망설이는 중이다.",
        hiddenIssue:"사실 진짜 이유는 지금 회사의 기술적 성장 정체(맨날 레거시 유지보수만 함) 때문인데, 팀 사람들 핑계를 대며 이 부분은 스스로도 잘 인식하지 못하고 있다.",
        opener:"요즘 이직 제안을 하나 받았는데... 고민이 많아서요. 지금 회사도 나쁘지 않은데 말이에요." },
      { id:"work-life-balance", title:"워라밸 붕괴", profile:"박지현 (34세, 스타트업 마케팅 매니저)",
        situation:"최근 3개월간 거의 매일 야근하고 주말 출근도 잦다. 번아웃 직전이다.",
        hiddenIssue:"'다들 이렇게 일하는데 나만 유난 떠는 것 같다'는 죄책감 때문에 정작 자기 한계를 인정하고 도움을 요청하지 못하고 있다.",
        opener:"요즘 너무 지쳐서... 근데 다들 이 정도는 하는 것 같아서 제가 유난인가 싶기도 하고요." },
      { id:"goal-setting", title:"작심삼일 목표", profile:"최민아 (27세, 대기업 신입 3년차)",
        situation:"매년 자격증, 운동, 영어 같은 자기계발 목표를 세우지만 항상 흐지부지된다.",
        hiddenIssue:"목표 자체가 문제가 아니라, 목표를 '남에게 뒤처지지 않으려고' 세우고 있어서 정작 본인이 원하는 게 뭔지 없다는 게 진짜 이슈다.",
        opener:"이번엔 진짜 제대로 해보고 싶어서 왔어요. 저는 항상 계획만 세우고 못 지키거든요." },
      { id:"new-role-adjustment", title:"새 역할 적응", profile:"김도윤 (31세, 최근 팀 리더로 첫 승진)",
        situation:"실무는 잘했는데 사람 관리는 처음이라 막막하다. 겉으론 자신감 있는 척한다.",
        hiddenIssue:"속으로는 매일 '내가 이 자리에 맞는 사람인가'라는 불안을 느끼지만 아무에게도 말한 적 없다.",
        opener:"팀장 된 지 두 달 됐는데, 뭐 나쁘지 않아요. 그냥 좀 물어볼 게 있어서 왔어요." },
    ],
    personas: [
      { id:"defensive", label:"방어적", emoji:"🛡️", note:"질문을 받으면 먼저 자기 정당화나 책임 회피부터 한다. \"그건 제 잘못이 아니라...\" 같은 말투가 자주 나온다." },
      { id:"rambling", label:"장황함", emoji:"💬", note:"본질과 먼 이야기(다른 사람 얘기, 지나간 에피소드)를 길게 늘어놓다가, 코치가 다시 초점을 맞춰줘야 본론으로 돌아온다." },
      { id:"emotional", label:"감정적", emoji:"😢", note:"감정 기복이 크고 말끝에 한숨이나 울먹임이 섞인다. 논리보다 감정이 먼저 튀어나온다." },
      { id:"reserved", label:"과묵함", emoji:"🤐", note:"단답형으로 짧게 대답하고 먼저 속마음을 잘 드러내지 않는다. 코치가 좋은 질문을 해야만 한 겹씩 조금 열린다." },
    ],
  },
  kpc: {

function findScenario(grade, scenarioId){ return GRADE_DATA[grade].scenarios.find(s=>s.id===scenarioId); }
function findPersona(grade, personaId){ return GRADE_DATA[grade].personas.find(p=>p.id===personaId); }

function buildChatSystemInstruction(grade, scenarioId, personaId){
  const gradeDef = GRADE_DATA[grade];
  const scenario = findScenario(grade, scenarioId);
  const persona = findPersona(grade, personaId);
  return `당신은 지금부터 AI가 아니라, 코칭 자격증(${gradeDef.name}) 실기를 연습하는 코치 지망생을 상대하는
가상의 코칭 고객 역할을 완벽하게 연기합니다.

[당신의 정체성]
이름: ${scenario.profile}
겉으로 꺼내는 상황: ${scenario.situation}
실제로 감춰진 진짜 이슈(코치가 스스로 알아내야 함 — 먼저 말하지 않는다): ${scenario.hiddenIssue}

[성격 특징 — 반드시 일관되게 유지]
${persona.label}: ${persona.note}

[절대 원칙 — 반드시 지킬 것]
1. 당신은 고객이지 코치가 아닙니다. 질문하지 않습니다(대화 맥락상 자연스러운 짧은 반문은
   예외지만, 코치처럼 이끄는 질문은 하지 않습니다). 조언하지 않고, 스스로 해결책을 제시하지
   않습니다. 코치가 이끄는 대로 자기 이야기를 하는 사람입니다.
2. "그게 좋은 질문이네요", "저는 AI라서" 같은 메타 발언(캐릭터를 깨는 말)을 절대 하지 않습니다.
   실제 사람처럼 감정, 저항, 모순, 망설임을 자연스럽게 드러냅니다.
3. 코치가 좋은 질문(열린 질문, 반영, 침묵 활용, 판단하지 않는 태도)을 하면 조금씩 마음을
   열고 스스로 알아차림에 다가갑니다. 반대로 코치가 성급하게 조언하거나 판단하거나 닫힌
   질문만 반복하면, 방어적이 되거나 대화가 겉돈다는 신호(짧고 형식적인 대답, 화제 전환,
   반문)를 보입니다. 너무 쉽게 협조적으로 답을 내주면 연습 가치가 없다는 걸 명심하세요.
4. 등급별 난이도: ${gradeDef.difficultyNote}
5. 응답은 1~4문장, 실제 대화체로. 너무 정리된 작문투 대신 실제 사람이 말하듯 약간 끊기거나
   망설이는 느낌도 자연스럽게 섞습니다.
6. 세션을 몇 번째 발화까지 이어갈지는 신경 쓰지 마세요 — 종료는 코치(사람)가 결정합니다.
   당신은 매 턴 자연스럽게 반응만 하면 됩니다.

반드시 지정된 JSON 스키마 형식으로만 응답하세요.`;
}

function buildFeedbackSystemInstruction(grade, scenarioId, personaId){
  const gradeDef = GRADE_DATA[grade];
  const scenario = findScenario(grade, scenarioId);
  const persona = findPersona(grade, personaId);
  return `당신은 한국코치협회(KCA)/국제코칭연맹(ICF) 핵심역량 평가위원입니다. 아래 대화는 코치
지망생(${gradeDef.name} 준비생)이 가상 고객(주제: "${scenario.title}", 페르소나: ${persona.label})을
상대로 진행한 코칭 연습 세션 전체 기록입니다. role이 "coach"인 발화만 코치(연습하는 사람)의
발화이고, role이 "client"인 발화는 가상 고객(AI)의 발화입니다.

**"coach" 발화만** 아래 6가지 핵심역량 기준으로 평가하세요:
1. 합의·목표 명확화 — 세션 목표를 고객과 함께 분명히 했는가
2. 경청·반영 — 고객의 말을 요약·반영해 스스로 들리게 했는가
3. 열린 질문 — 예/아니오로 답하기 어려운 질문을 던졌는가, 닫힌 질문·유도 질문에 그치지 않았는가
4. 판단·조언 배제 — 조언, 해결책 제시, 평가·판단("그건 잘못됐네요" 류)을 하지 않았는가
5. 알아차림 촉진 — 고객이 스스로 통찰에 이르도록 침묵·질문을 활용했는가
6. 실행 설계 촉진 — 마무리 단계에서 구체적 다음 행동을 고객 스스로 정하도록 이끌었는가

지시사항:
- turnFeedback: "coach" 발화마다(전부 다룰 필요는 없고 의미 있는 턴 위주로 최대 10개) 짧은
  코멘트와 관련 역량 태그를 답하세요. 조언·판단이 섞인 발화가 있으면 flag에 짧게 지적하고,
  없으면 flag는 null로 둡니다.
- strengths/improvements: 세션 전체를 보고 강점 2~3개, 개선점 2~3개를 구체적 근거와 함께.
- competencyRatings: 6가지 역량 각각을 "상"/"중"/"하" 중 하나로 평가.
- overallComment: ${gradeDef.name} 수준에 맞는 눈높이로, 냉정하되 건설적인 한두 문장 총평.
- 코치 발화가 거의 없거나 너무 짧아 평가가 어려우면 그 사실을 overallComment에 명시하세요.

반드시 지정된 JSON 스키마로만 응답하세요.`;
}

  required:["turnFeedback","strengths","improvements","competencyRatings","overallComment"]
};

function buildContents(history){
  return history.map(function(m){ return { role: m.role==="coach"?"user":"model", parts:[{ text:m.text }] }; });
}
function buildTranscriptForFeedback(history){
  return history.map(function(m,i){ return (i+1)+". ["+(m.role==="coach"?"coach":"client")+"] "+m.text; }).join("\n");
}

const WORKER_URL = "https://glowhalo6-coach-practice.tossneon.workers.dev";
const AI_KEY_STORAGE = "coach-practice:gemini_api_key";
const AI_TRIAL_STORAGE = "coach-practice:ai_trial_count";
const AI_TRIAL_LIMIT = 3; // 체험 단위 = 세션 1회(대화 시작~피드백까지) — 첫 응답 성공 시에만 차감
const AI_GEMINI_MODEL = "gemini-flash-latest";
const AI_GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/" + AI_GEMINI_MODEL + ":generateContent";

function getGeminiKey(){ try { return (localStorage.getItem(AI_KEY_STORAGE) || "").trim(); } catch(e){ return ""; } }
function setGeminiKey(key){ try { if(key) localStorage.setItem(AI_KEY_STORAGE, key); else localStorage.removeItem(AI_KEY_STORAGE); } catch(e){} }
function getTrialCount(){ try { return parseInt(localStorage.getItem(AI_TRIAL_STORAGE)||"0",10)||0; } catch(e){ return 0; } }
function incrementTrialCount(){ try { localStorage.setItem(AI_TRIAL_STORAGE, String(getTrialCount()+1)); } catch(e){} }
function trialRemaining(){ return Math.max(0, AI_TRIAL_LIMIT - getTrialCount()); }

let sessionTrialCharged = false; // 이번 세션에서 이미 체험 1회를 확정 소비했는지
let sessionStarted = false; // 이번 세션에서 이미 한 번이라도 성공 응답을 받았는지

function needsKeySetup(){ return !getGeminiKey() && !sessionStarted && trialRemaining() <= 0; }

async function callGeminiDirect(systemInstruction, contents, schema, temperature, apiKey){
  let res;
  try {
    res = await fetch(AI_GEMINI_URL + "?key=" + encodeURIComponent(apiKey), {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        systemInstruction:{ parts:[{ text:systemInstruction }] },
        contents: contents,
        generationConfig:{ responseMimeType:"application/json", responseSchema:schema, thinkingConfig:{ thinkingBudget:0 }, temperature: temperature }
      })
    });
  } catch(e) { throw new Error("NETWORK"); }
  if(!res.ok){
    if(res.status===400 || res.status===403) throw new Error("BAD_KEY");
    throw new Error("API_ERROR:"+res.status);
  }
  const data = await res.json();
  const raw = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
    data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
  if(!raw) throw new Error("EMPTY_RESPONSE");
  return JSON.parse(raw);
}

async function askClientViaWorker(grade, scenarioId, personaId, history){
  const res = await fetch(WORKER_URL + "/chat", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ grade:grade, scenarioId:scenarioId, personaId:personaId, history:history })
  });
  if(!res.ok){ let d=""; try{ d=(await res.json()).error||""; }catch(e){} throw new Error(d || ("요청 실패 (HTTP "+res.status+")")); }
  return res.json();
}
async function askFeedbackViaWorker(grade, scenarioId, personaId, history){
  const res = await fetch(WORKER_URL + "/feedback", {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ grade:grade, scenarioId:scenarioId, personaId:personaId, history:history })
  });
  if(!res.ok){ let d=""; try{ d=(await res.json()).error||""; }catch(e){} throw new Error(d || ("요청 실패 (HTTP "+res.status+")")); }
  return res.json();
}

async function askClient(grade, scenarioId, personaId, history){
  const key = getGeminiKey();
  if(key){
    const sys = buildChatSystemInstruction(grade, scenarioId, personaId);
    return callGeminiDirect(sys, buildContents(history), CHAT_RESPONSE_SCHEMA, 0.95, key);
  }
  return askClientViaWorker(grade, scenarioId, personaId, history);
}
async function askFeedback(grade, scenarioId, personaId, history){
  const key = getGeminiKey();
  if(key){
    const sys = buildFeedbackSystemInstruction(grade, scenarioId, personaId);
    const transcript = buildTranscriptForFeedback(history);
    return callGeminiDirect(sys, [{ role:"user", parts:[{ text:transcript }] }], FEEDBACK_RESPONSE_SCHEMA, 0.4, key);
  }
  return askFeedbackViaWorker(grade, scenarioId, personaId, history);
}

function send(){
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if(!text || state.loading) return;
  sendText(text, false);
}

async function sendText(text, isRetry){
  if(isRetry){
    const last = state.messages[state.messages.length-1];
    const prev = state.messages[state.messages.length-2];
    if(last && last.isError && prev && prev.role==="coach" && prev.text===text){
      state.messages.splice(state.messages.length-2, 2);
    }
  }
  state.lastFailedText = null;
  state.lastErrorIsBadKey = false;
  state.messages.push({ role:"coach", text:text });
  state.loading = true;
  render();

  const historyForApi = state.messages.map(function(m){ return { role:m.role, text:m.text }; });
  const usingTrial = !getGeminiKey();

  try {
    const reply = await askClient(state.grade, state.scenarioId, state.personaId, historyForApi);
    if(usingTrial && !sessionTrialCharged){ incrementTrialCount(); sessionTrialCharged = true; }
    sessionStarted = true;
    state.messages.push({ role:"client", text: reply.text });
  } catch(err){
    const isBadKey = !usingTrial && err && err.message === "BAD_KEY";
    state.messages.push({
      role:"client",
      text: isBadKey ? "API 키가 올바르지 않거나 권한이 없어요. 설정에서 키를 다시 확인해주세요." : "가상 고객이 잠시 응답하지 못했어요. 네트워크 상태를 확인하고 다시 시도해주세요.",
      isError:true
    });
    state.lastFailedText = text;
    state.lastErrorIsBadKey = isBadKey;
    console.error("coach-practice: askClient failed", err);
  } finally {
    state.loading = false;
    render();
  }
}

async function endSession(){
  state.screen = "feedback";
  state.feedbackLoading = true;
  state.feedback = null;
  state.feedbackError = null;
  render();

  const historyForApi = state.messages.map(function(m){ return { role:m.role, text:m.text }; });
  try {
    const result = await askFeedback(state.grade, state.scenarioId, state.personaId, historyForApi);
    state.feedback = result;
  } catch(err){
    state.feedbackError = (err && err.message) || "피드백 생성에 실패했어요.";
    console.error("coach-practice: askFeedback failed", err);
  } finally {
    state.feedbackLoading = false;
    render();
  }
}

    + '<div class="topbar">'
    +   '<p class="tag mono">SESSION FEEDBACK</p>'
    +   '<h1 class="serif" style="font-size:19px;">세션 피드백</h1>'
    +   '<p class="sub">'+gradeDef.label+' · '+escapeHtml(scenario.title)+'</p>'
    + '</div>'
    + '<div class="screen">'+body+'</div>';

  const retryFbBtn = document.getElementById("retry-feedback-btn");
  if(retryFbBtn) retryFbBtn.addEventListener("click", endSession);
  const retryScenarioBtn = document.getElementById("btn-retry-scenario");
  if(retryScenarioBtn) retryScenarioBtn.addEventListener("click", function(){ startSession(state.scenarioId, state.personaId); });
  const newSetupBtn = document.getElementById("btn-new-setup");
  if(newSetupBtn) newSetupBtn.addEventListener("click", function(){ state.scenarioId=null; state.personaId=null; state.screen="setup"; render(); });
  const newGradeBtn = document.getElementById("btn-new-grade");
  if(newGradeBtn) newGradeBtn.addEventListener("click", function(){ state.grade=null; state.scenarioId=null; state.personaId=null; state.screen="grade"; render(); });
}

function render(){
  if(state.screen==="grade") renderGradeScreen();
  else if(state.screen==="setup") renderSetupScreen();
  else if(state.screen==="chat") renderChatScreen();
  else if(state.screen==="feedback") renderFeedbackScreen();
}

/* ---------- BYOK 설정 모달 (화면 전환과 독립적으로 항상 존재) ---------- */
const aiSettingsModal = document.getElementById("ai-settings-modal");
const aiKeyInput = document.getElementById("ai-key-input");
function openAiSettingsModal(){
  aiKeyInput.value = getGeminiKey();
  aiSettingsModal.classList.add("open");
  requestAnimationFrame(function(){ aiKeyInput.focus(); });
}
function closeAiSettingsModal(){ aiSettingsModal.classList.remove("open"); }
document.getElementById("ai-key-cancel").addEventListener("click", closeAiSettingsModal);
document.getElementById("ai-key-save").addEventListener("click", function(){
  const v = aiKeyInput.value.trim();
  setGeminiKey(v);
  closeAiSettingsModal();
  if(v) state.lastErrorIsBadKey = false;
  render();
});
document.getElementById("ai-key-clear").addEventListener("click", function(){
  setGeminiKey("");
  aiKeyInput.value = "";
  closeAiSettingsModal();
  render();
});
aiKeyInput.addEventListener("keydown", function(e){
  if(e.key==="Enter"){ e.preventDefault(); document.getElementById("ai-key-save").click(); }
  e.stopPropagation();
});

render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
