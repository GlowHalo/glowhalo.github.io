<title>Deskmates 3D Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700&display=swap">
<style>
  :root {
    --bg: #f3e9d8;
    --ink: #4a3826;
    --card: #fffaf0;
    --border: #e8d4b0;
    --accent: #e8965a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  #topbar .brand { font-family: 'Fredoka', -apple-system, sans-serif; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; }

  #labels { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  .tag {
    position: absolute;
    left: 0; top: 0;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
  }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: 56px;
    background: var(--card);
    border-bottom: 3px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 22px;
  }
  #topbar .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
  #topbar .logo {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 12px;
  }
  #topbar .hint { font-size: 12px; color: #8a7150; font-weight: 600; }

  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    font-weight: 700; font-size: 14px; color: #8a7150;
  }
</style>

<div id="topbar">
  <div class="brand"><span class="logo">D</span> Deskmates — 3D 프로토타입 (심즈풍 로우폴리)</div>
  <div class="hint">드래그로 회전 · 스크롤로 확대/축소</div>
</div>
<div id="scene"></div>
<div id="labels"></div>
<div id="loading">사무실 불러오는 중…</div>
