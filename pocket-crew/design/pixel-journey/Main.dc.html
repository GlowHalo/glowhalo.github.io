<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: {{accent}}; text-decoration: none; }
    a:hover { opacity: 0.8; }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:#f3e9d8; font-family:'Nunito', sans-serif; color:#4a3826; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <div style="height:60px; flex-shrink:0; background:#fffaf0; border-bottom:3px solid #e8d4b0; display:flex; align-items:center; padding:0 24px; z-index:5;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:30px; height:30px; border-radius:8px; background:{{accent}}; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,0.15);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fff"/></svg>
      </div>
      <div style="font-family:'Fredoka', sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;">Deskmates</div>
    </div>
  </div>

  <div style="flex:1; position:relative; background-image: radial-gradient(circle, rgba(74,56,38,0.06) 1.5px, transparent 1.5px); background-size:22px 22px; background-color:#efe0c4; display:flex; align-items:center; justify-content:center;">

    <div style="position:absolute; left:10%; top:10%; width:380px; height:380px; border-radius:50%; background:radial-gradient(circle, {{accent}}22 0%, transparent 70%); pointer-events:none;"></div>
    <div style="position:absolute; right:8%; bottom:10%; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, #ffd9a044 0%, transparent 70%); pointer-events:none;"></div>

    <div style="width:640px; background:#fffaf0; border-radius:24px; box-shadow:0 10px 0 #d9c39c, 0 20px 40px rgba(74,56,38,0.15); padding:44px 52px 40px; position:relative;">

      <!-- step indicator -->
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:28px;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:6px; flex:1;">
            <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fredoka', sans-serif; font-weight:600; font-size:12px; flex-shrink:0; background:{{s.bg}}; color:{{s.fg}};">{{s.num}}</div>
            <div style="font-size:11px; font-weight:600; color:{{s.labelColor}}; white-space:nowrap;">{{s.label}}</div>
            <sc-if value="{{s.showLine}}" hint-placeholder-val="{{true}}">
              <div style="flex:1; height:2px; background:#e8d4b0; border-radius:1px;"></div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <!-- character -->
      <div style="display:flex; justify-content:center; margin-bottom:8px;">
        <div style="position:relative;">
          <div style="width:64px; height:64px; border-radius:50% 50% 48% 48%; background:#ffd7b0; position:relative; box-shadow:0 4px 0 rgba(0,0,0,0.08); margin:0 auto;">
            <div style="position:absolute; top:-20px; left:-6px; width:76px; height:38px; background:#5c3a26; border-radius:32px 32px 8px 8px;"></div>
            <div style="position:absolute; top:24px; left:16px; width:7px; height:9px; background:#3a2b1f; border-radius:2px;"></div>
            <div style="position:absolute; top:24px; left:40px; width:7px; height:9px; background:#3a2b1f; border-radius:2px;"></div>
            <div style="position:absolute; top:38px; left:24px; width:16px; height:6px; border-radius:0 0 8px 8px; background:#c17b56;"></div>
          </div>
          <div style="width:52px; height:50px; margin:-4px auto 0; background:{{accent}}; border-radius:16px 16px 6px 6px; box-shadow:0 4px 0 rgba(0,0,0,0.1);"></div>
        </div>
      </div>

      <h1 style="font-family:'Fredoka', sans-serif; font-weight:700; font-size:26px; text-align:center; margin:8px 0 10px; letter-spacing:-0.01em;">클로드와 함께 일할<br/>사무실을 만들어볼까요?</h1>
      <p style="text-align:center; font-size:14.5px; color:#8a7150; line-height:1.6; margin:0 0 22px; max-width:440px; margin-left:auto; margin-right:auto;">여기서 팀을 꾸리면, 실제 작업은 여러분의 클로드 계정으로 진행됩니다. 시작하려면 아래 두 가지가 필요해요.</p>

      <!-- requirement chips -->
      <div style="display:flex; gap:12px; justify-content:center; margin-bottom:28px;">
        <div style="display:flex; align-items:center; gap:8px; background:#f3e9d8; border:1.5px solid #e8d4b0; border-radius:12px; padding:10px 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a7150" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          <span style="font-size:13px; font-weight:600;">GitHub 계정</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; background:#f3e9d8; border:1.5px solid #e8d4b0; border-radius:12px; padding:10px 16px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8a7150" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
          <span style="font-size:13px; font-weight:600;">클로드 구독 (Pro·Max)</span>
        </div>
      </div>

      <!-- CTA -->
      <button style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px; background:#2b2118; color:#fffaf0; border:none; border-radius:14px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:16px; box-shadow:0 5px 0 #16110b; cursor:pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7a5 5 0 010-10h1"/><path d="M15 7h2a5 5 0 010 10h-1"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        GitHub로 계속하기
      </button>
      <p style="text-align:center; font-size:11.5px; color:#a68a5f; margin:12px 0 0;">이 버튼은 GitHub 로그인 화면으로 이동합니다 — 저희 앱과는 별도 화면이에요</p>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e8965a","options":["#e8965a","#7fae6f","#e07a6e","#6f8fc9"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#e8965a';
    const steps = [
      { num: '1', bg: '#2b2118', fg: '#fffaf0', label: 'GitHub 연결', labelColor: '#2b2118', showLine: true },
      { num: '2', bg: '#e8d4b0', fg: '#8a7150', label: '팀 이름 · 직원', labelColor: '#a68a5f', showLine: true },
      { num: '3', bg: '#e8d4b0', fg: '#8a7150', label: '시작', labelColor: '#a68a5f', showLine: false },
    ];
    return { accent, steps };
  }
}
</script>
</body>
</html>
