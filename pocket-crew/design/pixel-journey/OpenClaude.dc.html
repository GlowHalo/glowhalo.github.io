<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: {{accent}}; text-decoration: none; }
    a:hover { opacity: 0.8; }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:#f3e9d8; font-family:'Nunito', sans-serif; color:#4a3826; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <div style="height:60px; flex-shrink:0; background:#fffaf0; border-bottom:3px solid #e8d4b0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; z-index:5;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:30px; height:30px; border-radius:8px; background:{{accent}}; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,0.15);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fff"/></svg>
      </div>
      <div style="font-family:'Fredoka', sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;">Deskmates</div>
    </div>
    <div style="font-size:12.5px; color:#8a7150; font-weight:600;">하윤의 사무실 · 전략가·콘텐츠 담당 2명 고용됨</div>
  </div>

  <div style="flex:1; position:relative; background-image: radial-gradient(circle, rgba(74,56,38,0.06) 1.5px, transparent 1.5px); background-size:22px 22px; background-color:#efe0c4; display:flex; align-items:center; justify-content:center;">

    <div style="position:absolute; left:10%; top:12%; width:360px; height:360px; border-radius:50%; background:radial-gradient(circle, {{accent}}22 0%, transparent 70%); pointer-events:none;"></div>
    <div style="position:absolute; right:10%; bottom:10%; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, #ffd9a044 0%, transparent 70%); pointer-events:none;"></div>

    <div style="width:720px; text-align:center;">

      <div style="display:flex; align-items:center; gap:6px; justify-content:center; margin-bottom:36px;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <div style="display:flex; align-items:center; gap:6px;">
            <div style="width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Fredoka', sans-serif; font-weight:600; font-size:12px; flex-shrink:0; background:{{s.bg}}; color:{{s.fg}};">{{s.num}}</div>
            <div style="font-size:11px; font-weight:600; color:{{s.labelColor}}; white-space:nowrap;">{{s.label}}</div>
            <sc-if value="{{s.showLine}}" hint-placeholder-val="{{true}}">
              <div style="width:60px; height:2px; background:#e8d4b0; border-radius:1px; margin:0 4px;"></div>
            </sc-if>
          </div>
        </sc-for>
      </div>

      <h1 style="font-family:'Fredoka', sans-serif; font-weight:700; font-size:28px; margin:0 0 14px;">준비됐어요 — 이제 클로드를 깨울 차례예요</h1>
      <p style="font-size:15px; color:#8a7150; line-height:1.7; margin:0 0 40px; max-width:520px; margin-left:auto; margin-right:auto;">아래 버튼을 누르면 새 탭에서 claude.ai가 열리고, 방금 만든 사무실 저장소를 불러와 작업이 시작돼요.</p>

      <!-- flow diagram -->
      <div style="display:flex; align-items:center; justify-content:center; gap:0; margin-bottom:40px;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:10px; width:150px;">
          <div style="width:56px; height:56px; border-radius:14px; background:{{accent}}; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,0.15);">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fff"/></svg>
          </div>
          <div style="font-size:12px; font-weight:700;">Deskmates</div>
          <div style="font-size:10.5px; color:#a68a5f;">지금 이 화면</div>
        </div>

        <svg width="90" height="24" viewBox="0 0 90 24"><line x1="4" y1="12" x2="80" y2="12" stroke="#c9a97a" stroke-width="2.5" stroke-dasharray="5 5"/><polygon points="80,6 90,12 80,18" fill="#c9a97a"/></svg>

        <div style="display:flex; flex-direction:column; align-items:center; gap:10px; width:150px;">
          <div style="width:56px; height:56px; border-radius:14px; background:#fffaf0; border:2px dashed #c9a97a; display:flex; align-items:center; justify-content:center;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#a68a5f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 8h18"/></svg>
          </div>
          <div style="font-size:12px; font-weight:700;">새 브라우저 탭</div>
          <div style="font-size:10.5px; color:#a68a5f;">우리 앱을 벗어남</div>
        </div>

        <svg width="90" height="24" viewBox="0 0 90 24"><line x1="4" y1="12" x2="80" y2="12" stroke="#c9a97a" stroke-width="2.5" stroke-dasharray="5 5"/><polygon points="80,6 90,12 80,18" fill="#c9a97a"/></svg>

        <div style="display:flex; flex-direction:column; align-items:center; gap:10px; width:150px;">
          <div style="width:56px; height:56px; border-radius:14px; background:#2b2118; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,0.15);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.2H22l-6 4.4 2.3 7.1L12 16.3l-6.3 4.4 2.3-7.1-6-4.4h7.6z"/></svg>
          </div>
          <div style="font-size:12px; font-weight:700;">claude.ai</div>
          <div style="font-size:10.5px; color:#a68a5f;">본인 계정으로 로그인 · 작업 시작</div>
        </div>
      </div>

      <button style="display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:18px 44px; background:#2b2118; color:#fffaf0; border:none; border-radius:14px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:17px; box-shadow:0 5px 0 #16110b; cursor:pointer;">
        Claude Code에서 열기
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fffaf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
      </button>
      <p style="font-size:12px; color:#a68a5f; margin:16px 0 0;">처음이라면 그 화면에서 클로드 로그인이 한 번 더 뜰 수 있어요 — 그다음부턴 바로 시작돼요</p>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e8965a","options":["#e8965a","#7fae6f","#e07a6e","#6f8fc9"]}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#e8965a';
    const steps = [
      { num: '✓', bg: '#7fae6f', fg: '#fffaf0', label: 'GitHub 연결', labelColor: '#7fae6f', showLine: true },
      { num: '✓', bg: '#7fae6f', fg: '#fffaf0', label: '팀 이름 · 직원', labelColor: '#7fae6f', showLine: true },
      { num: '3', bg: '#2b2118', fg: '#fffaf0', label: '시작', labelColor: '#2b2118', showLine: false },
    ];
    return { accent, steps };
  }
}
</script>
</body>
</html>
