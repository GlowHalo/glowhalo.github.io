<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: {{accent}}; text-decoration: none; }
    a:hover { opacity: 0.8; }
  </style>
</helmet>
<div style="width:1440px; height:900px; background:#f3e9d8; font-family:'Nunito', sans-serif; color:#4a3826; display:flex; flex-direction:column; overflow:hidden; position:relative;">

  <div style="height:60px; flex-shrink:0; background:#fffaf0; border-bottom:3px solid #e8d4b0; display:flex; align-items:center; justify-content:space-between; padding:0 24px; z-index:5;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:30px; height:30px; border-radius:8px; background:{{accent}}; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,0.15);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="#fff"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="#fff" opacity="0.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="#fff"/></svg>
      </div>
      <div style="font-family:'Fredoka', sans-serif; font-weight:700; font-size:19px; letter-spacing:-0.01em;">Deskmates</div>
    </div>
    <div style="display:flex; align-items:center; gap:22px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:14px; color:#8a7150;">
      <span style="color:#4a3826;">하윤의 사무실</span>
      <span>직원</span>
      <span>방문</span>
      <div style="display:flex; align-items:center; gap:6px; background:#f3e9d8; border-radius:20px; padding:6px 12px 6px 10px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#7fae6f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0117-6.5l2.5 2.5M22 12.5a10 10 0 01-17 6.5L2.5 16.5"/></svg>
        <span style="font-size:11.5px; font-weight:700; color:#4a3826;">마지막 갱신 3분 전</span>
      </div>
      <div style="width:32px; height:32px; border-radius:9px; background:#ffd9a0; border:2px solid #fff; box-shadow:0 2px 0 rgba(0,0,0,0.1);"></div>
    </div>
  </div>

  <div style="flex:1; position:relative; background-image: radial-gradient(circle, rgba(74,56,38,0.06) 1.5px, transparent 1.5px); background-size:22px 22px; background-color:#efe0c4;">

    <div style="position:absolute; left:12%; top:8%; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, {{accent}}22 0%, transparent 70%); pointer-events:none;"></div>
    <div style="position:absolute; right:8%; bottom:22%; width:360px; height:360px; border-radius:50%; background:radial-gradient(circle, #ffd9a044 0%, transparent 70%); pointer-events:none;"></div>

    <!-- resume banner -->
    <sc-if value="{{showResumeBanner}}" hint-placeholder-val="{{true}}">
      <div style="position:absolute; left:50%; top:16px; transform:translateX(-50%); z-index:6; display:flex; align-items:center; gap:14px; background:#fffaf0; border:2px solid {{accent}}; border-radius:14px; padding:10px 12px 10px 18px; box-shadow:0 5px 0 #e8d4b0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
        <span style="font-size:13px; font-weight:700;">전달한 지시가 아직 처리 대기 중이에요</span>
        <button style="display:flex; align-items:center; gap:6px; padding:8px 14px; background:{{accent}}; color:#fff; border:none; border-radius:9px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:12.5px; cursor:pointer;">
          Claude Code에서 이어하기
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H9M17 7v8"/></svg>
        </button>
      </div>
    </sc-if>

    <div style="position:absolute; left:58%; top:80px; bottom:150px; width:6px; background:#d9c39c; border-radius:3px;"></div>

    <!-- ROOM 1: main desk room -->
    <div style="position:absolute; left:60px; top:70px; width:730px; bottom:150px;">
      <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:13px; color:#a68a5f; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px;">🏠 Main Floor</div>

      <div style="position:absolute; left:40px; top:60px; width:300px; height:190px; border-radius:24px; background:#e4b78f; box-shadow:inset 0 0 0 8px #d9a679, inset 0 0 0 12px #e4b78f;"></div>

      <div style="position:absolute; left:90px; top:100px; width:180px; height:74px; background:#c98f5c; border-radius:10px; box-shadow:0 6px 0 #a56f42;">
        <div style="position:absolute; left:18px; top:-38px; width:56px; height:40px; background:#3a3a3a; border-radius:6px; box-shadow:0 0 0 3px #2a2a2a;">
          <div style="position:absolute; inset:4px; background:{{accent}}; border-radius:2px; opacity:0.85;"></div>
        </div>
        <div style="position:absolute; left:100px; top:-16px; width:26px; height:26px; border-radius:50%; background:#7fae6f;"></div>
      </div>

      <div style="position:absolute; left:120px; top:190px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:52px; height:52px; border-radius:50% 50% 48% 48%; background:#ffd7b0; position:relative; box-shadow:0 4px 0 rgba(0,0,0,0.08);">
          <div style="position:absolute; top:-18px; left:-4px; width:60px; height:34px; background:#5c3a26; border-radius:26px 26px 8px 8px;"></div>
          <div style="position:absolute; top:20px; left:12px; width:6px; height:8px; background:#3a2b1f; border-radius:2px;"></div>
          <div style="position:absolute; top:20px; left:32px; width:6px; height:8px; background:#3a2b1f; border-radius:2px;"></div>
          <div style="position:absolute; top:32px; left:18px; width:16px; height:6px; border-radius:0 0 8px 8px; background:#c17b56;"></div>
        </div>
        <div style="width:44px; height:46px; margin-top:-4px; background:{{accent}}; border-radius:14px 14px 6px 6px; box-shadow:0 4px 0 rgba(0,0,0,0.1);"></div>
        <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:11px; margin-top:6px; background:#fffaf0; padding:3px 10px; border-radius:8px; box-shadow:0 2px 0 rgba(0,0,0,0.08);">전략가 · 리서치 중</div>
      </div>

      <div style="position:absolute; left:380px; top:110px; width:180px; height:74px; background:#c98f5c; border-radius:10px; box-shadow:0 6px 0 #a56f42;">
        <div style="position:absolute; left:18px; top:-38px; width:56px; height:40px; background:#3a3a3a; border-radius:6px; box-shadow:0 0 0 3px #2a2a2a;">
          <div style="position:absolute; inset:4px; background:#7fae6f; border-radius:2px; opacity:0.85;"></div>
        </div>
      </div>

      <div style="position:absolute; left:420px; top:200px; display:flex; flex-direction:column; align-items:center;">
        <div style="width:52px; height:52px; border-radius:50% 50% 48% 48%; background:#f4c6a0; position:relative; box-shadow:0 4px 0 rgba(0,0,0,0.08);">
          <div style="position:absolute; top:-14px; left:6px; width:40px; height:26px; background:#2a2a2a; border-radius:20px 20px 4px 4px;"></div>
          <div style="position:absolute; top:20px; left:12px; width:6px; height:8px; background:#3a2b1f; border-radius:2px;"></div>
          <div style="position:absolute; top:20px; left:32px; width:6px; height:8px; background:#3a2b1f; border-radius:2px;"></div>
        </div>
        <div style="width:44px; height:46px; margin-top:-4px; background:#7fae6f; border-radius:14px 14px 6px 6px; box-shadow:0 4px 0 rgba(0,0,0,0.1);"></div>
        <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:11px; margin-top:6px; background:#fffaf0; padding:3px 10px; border-radius:8px; box-shadow:0 2px 0 rgba(0,0,0,0.08);">콘텐츠 담당 · 초안 작성 중</div>
      </div>

      <div style="position:absolute; left:600px; top:170px;">
        <div style="width:34px; height:26px; background:#b9784a; border-radius:4px; margin:0 auto;"></div>
        <div style="width:52px; height:52px; background:#5f9455; border-radius:50% 50% 46% 46%; margin:-40px auto 0; box-shadow:inset -8px -6px 0 rgba(0,0,0,0.08);"></div>
      </div>
    </div>

    <!-- ROOM 2: meeting nook -->
    <div style="position:absolute; right:60px; top:70px; width:400px; bottom:150px;">
      <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:13px; color:#a68a5f; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:14px;">☕ Meeting Nook</div>
      <div style="position:absolute; left:60px; top:70px; width:200px; height:150px; border-radius:20px; background:#dfc79e; box-shadow:inset 0 0 0 6px #d0b485;"></div>
      <div style="position:absolute; left:100px; top:110px; width:120px; height:120px; border-radius:50%; background:#9c6b41; box-shadow:0 8px 0 #7a5230;"></div>
      <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:11px; margin-top:6px; text-align:center; background:#fffaf0; padding:3px 10px; border-radius:8px; box-shadow:0 2px 0 rgba(0,0,0,0.08); position:absolute; left:120px; top:230px; white-space:nowrap;">다음 갱신까지 대기 중</div>
    </div>

    <!-- instruction dock -->
    <div style="position:absolute; left:0; right:0; bottom:0; height:118px; background:#e4cea3; border-top:3px solid #d9c39c; display:flex; align-items:center; gap:16px; padding:0 32px;">
      <div style="font-family:'Fredoka', sans-serif; font-weight:600; font-size:12px; color:#8a7150; flex-shrink:0; width:110px; line-height:1.4;">새 지시<br/>남기기</div>
      <div style="flex:1; display:flex; align-items:center; gap:12px; background:#fffaf0; border-radius:16px; padding:8px 8px 8px 20px; box-shadow:0 4px 0 #d9c39c; max-width:820px;">
        <input value="{{draftText}}" style="flex:1; border:none; background:transparent; font-family:'Nunito', sans-serif; font-size:14.5px; color:#4a3826; outline:none;">
        <button style="display:flex; align-items:center; gap:8px; padding:10px 20px; background:{{accent}}; color:#fff; border:none; border-radius:11px; font-family:'Fredoka', sans-serif; font-weight:600; font-size:13.5px; cursor:pointer; flex-shrink:0;">
          전달
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div style="font-size:11px; color:#a68a5f; flex-shrink:0; width:200px; line-height:1.5;">다음에 세션을 열 때 클로드가 읽고 처리해요</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#e8965a","options":["#e8965a","#7fae6f","#e07a6e","#6f8fc9"]},"showResumeBanner":{"editor":"boolean","default":true}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#e8965a';
    const showResumeBanner = this.props.showResumeBanner ?? true;
    const draftText = '내일까지 경쟁사 3곳 비교표 만들어줘';
    return { accent, showResumeBanner, draftText };
  }
}
</script>
</body>
</html>
