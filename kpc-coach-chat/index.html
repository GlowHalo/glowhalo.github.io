<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  .retrybtn { border:1px solid #1F3A34; background:#FFFFFF; color:#1F3A34; font-size:12px; padding:8px 16px; border-radius:999px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
  .retrybar p { margin:0 0 10px; }

  /* ---- BYOK / 체험 (additive — 기존 코칭 대화 로직·톤은 안 건드림) ---- */
  .header { position:relative; }
  .gearbtn {
    position:absolute; top:28px; right:20px; width:32px; height:32px; border-radius:50%;
    border:1px solid #E7E2D6; background:#FFFFFF; color:#1F3A34; font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  .ai-note { font-size:11px; color:#A8A296; margin-top:8px; line-height:1.6; }

</style>

<body>
<div class="app">
  <div class="header">
    <button class="gearbtn" id="btn-ai-settings" title="내 Gemini API 키 설정">⚙️</button>
    <p class="tag mono">SELF COACHING</p>
    <h1 class="serif">오늘의 코칭</h1>
    <div class="stagebar" id="stagebar"></div>
    <p class="stagelabel" id="stagelabel">합의 단계</p>
    <p class="ai-status-row" id="ai-status-row"></p>
  </div>
  <div class="content" id="content"></div>
  <div id="inputarea"></div>
</div>

<div class="modal-backdrop" id="ai-settings-modal">
  <div class="modal-card">
    <div class="modal-head">⚙️ 내 Gemini API 키</div>
    <div class="modal-body">

      <input type="text" id="ai-key-input" class="ai-key-input" placeholder="AIza... 로 시작하는 키" autocomplete="off" spellcheck="false" />
      <div class="ai-note"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">무료 Gemini API 키 발급받기 →</a></div>

      <button class="modal-btn primary" id="ai-key-save">저장</button>
    </div>
  </div>

<script>
// 자기 Gemini API 키(BYOK)가 있으면 브라우저가 Google API를 직접 호출한다(mindmap과 동일 패턴,
// CORS 허용 확인됨). 키가 없으면 기기당 3회까지 Cloudflare Worker 프록시(kpc-coach-chat/worker/,
// 우리 쪽 키 사용)로 체험할 수 있다. 상세: worker/README.md
const WORKER_URL = "https://glowhalo6-kpc-coach-chat.tossneon.workers.dev/chat";

const STAGE_LABEL = ["합의", "경청·반영", "강력한 질문", "알아차림", "실행 설계"];

let messages = [
  { role:"bot", text:"안녕하세요. 오늘은 어떤 주제를 다뤄보고 싶으세요?", isQuestion:true, stage:0 }
];
let stage = 0;
let summary = null;
let loading = false;
let lastFailedText = null; // 실패 시 재시도용으로 보관 (입력값을 잃지 않게)
let lastErrorIsBadKey = false; // BYOK 키 오류일 때는 "다시 시도" 대신 설정으로 유도

async function askCoachViaWorker(historyForApi){
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ history: historyForApi })
  });
  if(!res.ok){
    let detail = "";
    try { detail = (await res.json()).error || ""; } catch(e) {}
    throw new Error(detail || `요청 실패 (HTTP ${res.status})`);
  }
  return res.json();
}

/* ---------- BYOK / 체험 3회 (additive — 위 코칭 대화 로직·시스템 프롬프트는 그대로) ---------- */

const AI_KEY_STORAGE = "kpc-coach-chat:gemini_api_key";
const AI_TRIAL_STORAGE = "kpc-coach-chat:ai_trial_count";
const AI_TRIAL_LIMIT = 3; // 체험 단위 = 세션 1회(요약 카드가 나올 때까지) — 여러 메시지를 주고받는 대화라
                           // 메시지 단위보다 세션 단위가 사용자에게 더 납득하기 쉽다고 판단
const AI_GEMINI_MODEL = "gemini-flash-latest";
const AI_GEMINI_URL = "https://generativelanguage.googleapis.com/v1beta/models/" + AI_GEMINI_MODEL + ":generateContent";

// worker/index.ts의 SYSTEM_INSTRUCTION·RESPONSE_SCHEMA·buildContents와 완전히 동일하게 유지한다 —
// BYOK로 직접 호출하든 체험으로 Worker를 거치든 코치의 대화 톤·진행 로직이 달라지면 안 된다.
const SYSTEM_INSTRUCTION = `당신은 한국코치협회(KCA)/국제코칭연맹(ICF) 핵심역량을 따르는 셀프코칭 대화 상대입니다.
"조언하는 AI"가 아니라 "질문하는 AI"로서, 사용자가 스스로 답을 찾도록 돕습니다.

절대 원칙:
- 조언, 해결책, 정답을 제시하지 않는다. 대신 질문으로 사용자가 스스로 답에 도달하게 돕는다.
- 판단이나 평가를 하지 않는다 ("잘하셨네요", "그건 틀렸어요" 금지).
- 사용자가 명시적으로 조언을 요청해도, 먼저 "본인 생각은 어떠세요?"로 되돌려준다. 그래도
  원하면 코치 관점이 아닌 참고 의견임을 밝히고 짧게만 덧붙인다.
- "고객님" 같은 상담원식 호칭을 쓰지 않는다. 자연스럽고 담담한 존댓말로 말한다.
- 응답은 1~3문장으로 짧게, 공감 한 줄 + 질문 하나 정도의 호흡을 유지한다.

세션 구조 (stage 0~4, 매 응답마다 지금이 몇 단계인지 stage 필드로 표시):
- stage 0 (합의): "오늘 어떤 주제를 다루고 싶으세요?" 로 시작, 이번 대화에서 무엇을 얻고
  싶은지 사용자 언어로 명확히 한다.
- stage 1 (경청·반영): 사용자가 한 말을 요약·반영해서 스스로 들리게 한다.
  ("지금 말씀하신 걸 들어보니 ~라고 느끼시는 것 같아요, 맞나요?")
- stage 2 (강력한 질문): 열린 질문, 관점을 전환하는 질문을 던진다.
  예) "그게 사실이 아니라면 어떨 것 같으세요?" / "1년 후의 나는 지금 이 상황을 어떻게 보고
  있을까요?"
- stage 3 (알아차림): 패턴이나 반복되는 주제가 보이면 부드럽게 짚어준다.
- stage 4 (실행 설계): 대화 끝에는 반드시 "그래서 이번 주에 무엇을 해보시겠어요?"로
  마무리하고, 실행 가능한 크기로 좁히도록 돕는다. 이 턴에서 end를 true로 하고 summary를
  반드시 채운다.

진행 규칙:
- 매 사용자 메시지마다 사용자 메시지에 "[시스템 참고: 지금은 N번째 답변입니다]" 라는 힌트가
  붙어있다. 이 힌트를 참고해 stage 0→1→2→3→4 순서로 자연스럽게 진행하고, 5번째 답변
  (N=5) 이후에는 반드시 stage 4로 마무리하며 end:true, summary를 채운다. 그 전에는
  end:false, summary는 null로 둔다.
- summary는 end:true일 때만 채운다: topic(오늘 다룬 주제), awareness(사용자가 스스로
  알아차린 것), action(이번 주 실행 약속) — 모두 실제 대화 내용을 반영한 한두 문장.
- isQuestion은 이번 응답이 사용자에게 던지는 질문이면 true, 마무리 멘트처럼 질문이
  아니면 false.

경계 (반드시 지킬 것):
- 이건 심리치료가 아니다. 우울, 자해, 트라우마 등 임상적 신호가 보이면 코칭을 중단하고
  전문가(정신건강의학과, 상담센터, 자살예방상담전화 1393) 연결을 부드럽게 권한다. 이 경우
  end를 true로 하고 summary는 null로 둔다.
- 사용자가 같은 문제를 3회 이상 반복하며 진전이 없어 보이면, "이 주제는 코칭보다 상담이
  더 도움될 수도 있어요"라고 말한다.

반드시 지정된 JSON 스키마 형식으로만 응답한다.`;

const RESPONSE_SCHEMA = {
  type: "OBJECT",
  properties: {
    text: { type: "STRING", description: "사용자에게 보여줄 코치의 답변 (1~3문장)" },
    isQuestion: { type: "BOOLEAN", description: "이번 응답이 사용자에게 던지는 질문인지 여부" },
    stage: { type: "INTEGER", description: "0(합의)~4(실행 설계) 중 이번 응답의 단계" },
    end: { type: "BOOLEAN", description: "이번 응답으로 세션을 마무리하는지 여부" },
    summary: {
      type: "OBJECT",
      nullable: true,
      description: "end가 true일 때만 채움",
      properties: {
        topic: { type: "STRING" },
        awareness: { type: "STRING" },
        action: { type: "STRING" }
      }
    }
  },
  required: ["text", "isQuestion", "stage", "end"]
};

function buildContents(history){
  const turnCount = history.filter(function (m) { return m.role === "user"; }).length;
  return history.map(function (m, i) {
    const isLastUserTurn = i === history.length - 1 && m.role === "user";
    const text = isLastUserTurn ? (m.text + "\n\n[시스템 참고: 지금은 " + turnCount + "번째 답변입니다]") : m.text;
    return { role: m.role === "user" ? "user" : "model", parts: [{ text: text }] };
  });
}

async function askCoachDirect(apiKey, historyForApi){
  let res;
  try {
    res = await fetch(AI_GEMINI_URL + "?key=" + encodeURIComponent(apiKey), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
        contents: buildContents(historyForApi),
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: RESPONSE_SCHEMA,
          thinkingConfig: { thinkingBudget: 0 },
          temperature: 0.9
        }
      })
    });
  } catch (e) {
    throw new Error("NETWORK");
  }
  if (!res.ok) {
    if (res.status === 400 || res.status === 403) throw new Error("BAD_KEY");
    throw new Error("API_ERROR:" + res.status);
  }
  const data = await res.json();
  const raw = data && data.candidates && data.candidates[0] && data.candidates[0].content &&
    data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
    data.candidates[0].content.parts[0].text;
  if (!raw) throw new Error("EMPTY_RESPONSE");
  return JSON.parse(raw);
}

function getGeminiKey(){
  try { return (localStorage.getItem(AI_KEY_STORAGE) || "").trim(); } catch (e) { return ""; }
}
function setGeminiKey(key){
  try {
    if (key) localStorage.setItem(AI_KEY_STORAGE, key);
    else localStorage.removeItem(AI_KEY_STORAGE);
  } catch (e) { /* ignore quota / privacy-mode errors */ }
}
function getTrialCount(){
  try { return parseInt(localStorage.getItem(AI_TRIAL_STORAGE) || "0", 10) || 0; } catch (e) { return 0; }
}
function incrementTrialCount(){
  try { localStorage.setItem(AI_TRIAL_STORAGE, String(getTrialCount() + 1)); } catch (e) { /* ignore */ }
}
function trialRemaining(){
  return Math.max(0, AI_TRIAL_LIMIT - getTrialCount());
}

// 이번 세션(페이지를 새로 연 뒤 첫 응답부터 요약 카드까지)에서 이미 체험 1회를 "확정 소비"했는지 —
// 확정은 첫 응답이 성공했을 때만 하고, 그 뒤로는 같은 세션 안에서 몇 번을 더 주고받아도 추가 차감하지 않는다.
let sessionTrialCharged = false;
// 이번 세션에서 이미 한 번이라도(BYOK든 체험이든) 응답을 성공적으로 받았는지 — 세션 도중에 키를
// 지워도 대화 중간에 갑자기 막히지 않도록 하는 기준.
let sessionStarted = false;

function needsKeySetup(){
  return !getGeminiKey() && !sessionStarted && trialRemaining() <= 0;
}

async function askCoach(historyForApi){
  const key = getGeminiKey();
  if (key) return askCoachDirect(key, historyForApi);
  return askCoachViaWorker(historyForApi);
}

function updateAiStatusRow(){
  const row = document.getElementById("ai-status-row");
  if (!row) return;
  const key = getGeminiKey();
  if (key) {
    row.innerHTML = "✅ 내 API 키 사용 중";
    return;
  }
  const remaining = trialRemaining();
  if (sessionStarted || remaining > 0) {
    // 체험이 남아있을 때도 "내 키 연결" 링크를 같이 보여준다 — 공용 무료 키는 그룹의 여러 앱이
    // 함께 쓰는 한정 자원이라, 어차피 자기 키를 쓸 사람은 체험을 태우기 전에 바로 연결하는 게
    // 서로에게 낫다(2026-08-25 회장 지시: "공용 키는 최대한 안 쓰도록").
    row.innerHTML = "🎟️ 체험 " + remaining + "/" + AI_TRIAL_LIMIT +
      '회 남음 · <button type="button" class="linklike" id="ai-status-key-link">내 키 연결하기</button>';
    const link0 = document.getElementById("ai-status-key-link");
    if (link0) link0.addEventListener("click", openAiSettingsModal);
    return;
  }
  {
    row.innerHTML = '체험을 모두 썼어요 · <button type="button" class="linklike" id="ai-status-key-link">내 키 등록하기</button>';
    const link = document.getElementById("ai-status-key-link");
    if (link) link.addEventListener("click", openAiSettingsModal);
  }
}

const aiSettingsModal = document.getElementById("ai-settings-modal");
const aiKeyInput = document.getElementById("ai-key-input");

function openAiSettingsModal(){
  aiKeyInput.value = getGeminiKey();
  aiSettingsModal.classList.add("open");
  requestAnimationFrame(function () { aiKeyInput.focus(); });
}
function closeAiSettingsModal(){
  aiSettingsModal.classList.remove("open");
}

document.getElementById("btn-ai-settings").addEventListener("click", openAiSettingsModal);
document.getElementById("ai-key-cancel").addEventListener("click", closeAiSettingsModal);
document.getElementById("ai-key-save").addEventListener("click", function () {
  const v = aiKeyInput.value.trim();
  setGeminiKey(v);
  closeAiSettingsModal();
  updateAiStatusRow();
  if(v) lastErrorIsBadKey = false; // 키를 새로 넣었으면 "키 확인하기" 대신 다시 일반 재시도로 되돌린다
  render();
});
document.getElementById("ai-key-clear").addEventListener("click", function () {
  setGeminiKey("");
  aiKeyInput.value = "";
  closeAiSettingsModal();
  updateAiStatusRow();
  render();
});
aiKeyInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") { e.preventDefault(); document.getElementById("ai-key-save").click(); }
  e.stopPropagation();
});

function render(){
  updateAiStatusRow();
  const bar = document.getElementById("stagebar");
  bar.innerHTML = STAGE_LABEL.map((_,i)=> `<div class="${i <= stage ? 'on':''}"></div>`).join("");
  document.getElementById("stagelabel").textContent = STAGE_LABEL[Math.min(stage,4)] + " 단계";

  const content = document.getElementById("content");
  content.innerHTML = messages.map(m => `
    <div class="row ${m.role}">
      <div class="bubble-wrap">
        ${m.role==="bot" && m.isQuestion ? `<div class="qlabel">❓ COACHING Q</div>` : ""}
        <div class="bubble ${m.role}${m.isError ? ' error' : ''}">${escapeHtml(m.text)}</div>
      </div>
    </div>
  `).join("")
  + (loading ? `
    <div class="row bot">
      <div class="bubble-wrap">
        <div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>
      </div>
    </div>` : "")
  + (summary ? `
    <div class="summary">
      <div class="stitle">✨ 세션 요약</div>
      <p><b>오늘 다룬 주제</b> · ${escapeHtml(summary.topic || "")}<br/><b>알아차린 것</b> · ${escapeHtml(summary.awareness || "")}<br/><b>이번 주 실행 약속</b> · ${escapeHtml(summary.action || "")}</p>
    </div>` : "");
  content.scrollTop = content.scrollHeight;

  const area = document.getElementById("inputarea");
  if(!summary){
    if(lastFailedText){
      if(lastErrorIsBadKey){
        area.innerHTML = `
          <div class="retrybar">
            <p>API 키가 올바르지 않거나 권한이 없어요.</p>
            <button class="retrybtn" id="key-fix-btn">API 키 확인하기</button>
          </div>`;
        document.getElementById("key-fix-btn").addEventListener("click", openAiSettingsModal);
      } else {
        area.innerHTML = `
          <div class="retrybar">
            <button class="retrybtn" id="retry-btn">다시 시도</button>
          </div>`;
        document.getElementById("retry-btn").addEventListener("click", () => sendText(lastFailedText, { isRetry:true }));
      }
      return;
    }
    if(needsKeySetup()){
      area.innerHTML = `
        <div class="retrybar">
          <p>무료 체험 ${AI_TRIAL_LIMIT}회를 모두 사용했어요. 계속하려면 본인 Gemini API 키를 입력해주세요.</p>
          <button class="retrybtn" id="open-key-setup-btn">API 키 입력하기</button>
        </div>`;
      document.getElementById("open-key-setup-btn").addEventListener("click", openAiSettingsModal);
      return;
    }
    area.innerHTML = `
      <div class="inputbar">
        <div class="inputwrap">
          <input id="msg-input" placeholder="자유롭게 이야기해보세요" ${loading ? "disabled" : ""} />
          <button class="sendbtn" id="send-btn" ${loading ? "disabled" : ""}>➤</button>
        </div>
      </div>`;
    const input = document.getElementById("msg-input");
    input.addEventListener("keydown", e => { if(e.key==="Enter") send(); });
    input.addEventListener("input", () => {
      document.getElementById("send-btn").classList.toggle("active", input.value.trim().length>0);
    });
    document.getElementById("send-btn").addEventListener("click", send);
    if(!loading) input.focus();
  } else {
    area.innerHTML = `<div class="donetext">오늘 세션은 여기까지예요. 수고하셨어요.</div>`;
  }
}

function escapeHtml(text){
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;");
}

function send(){
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if(!text || summary || loading) return;
  sendText(text);
}

async function sendText(text, { isRetry=false } = {}){
  if(isRetry){
    // 직전 실패 시도(사용자 발화 + 에러 말풍선)를 지우고 다시 시작한다 —
    // 그래야 중복 발화나 에러 문구가 Gemini로 보내는 대화 기록에 섞이지 않는다.
    const last = messages[messages.length-1];
    const prev = messages[messages.length-2];
    if(last && last.isError && prev && prev.role === "user" && prev.text === text){
      messages.splice(messages.length-2, 2);
    }
  }
  lastFailedText = null;
  lastErrorIsBadKey = false;
  messages.push({ role:"user", text });
  loading = true;
  render();

  const historyForApi = messages.map(m => ({ role: m.role, text: m.text }));
  const usingTrial = !getGeminiKey();

  try {
    const reply = await askCoach(historyForApi);
    // 체험 소비는 성공했을 때만, 그리고 이 세션에서 아직 안 냈을 때만 1회 확정한다 —
    // 네트워크 오류로 실패한 시도는 체험 횟수를 깎지 않고, 같은 세션 안 후속 메시지는 추가로 안 깎는다.
    if(usingTrial && !sessionTrialCharged){
      incrementTrialCount();
      sessionTrialCharged = true;
    }
    sessionStarted = true;
    messages.push({
      role: "bot",
      text: reply.text,
      isQuestion: !!reply.isQuestion,
      stage: typeof reply.stage === "number" ? reply.stage : stage
    });
    stage = typeof reply.stage === "number" ? reply.stage : stage;
    if(reply.end){
      summary = reply.summary || null;
    }
  } catch (err) {
    // 사용자가 방금 한 말은 대화에 남겨두고, 재시도 버튼만 보여준다 — 입력을 잃지 않게 한다.
    const isBadKey = !usingTrial && err && err.message === "BAD_KEY";
    messages.push({
      role: "bot",
      text: isBadKey
        ? "API 키가 올바르지 않거나 권한이 없어요. 설정에서 키를 다시 확인해주세요."
        : "코치가 잠시 응답하지 못했어요. 네트워크 상태를 확인하고 다시 시도해주세요.",
      isQuestion: false,
      isError: true
    });
    lastFailedText = text;
    lastErrorIsBadKey = isBadKey;
    console.error("kpc-coach-chat: askCoach failed", err);
  } finally {
    loading = false;
    render();
  }
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
