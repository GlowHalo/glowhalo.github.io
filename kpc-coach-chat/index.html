<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 코칭</title>
<meta name="description" content="조언 대신 질문으로 스스로 답을 찾게 돕는 ICF/KCA 역량 기반 셀프코칭 대화 상대." />
<meta name="theme-color" content="#1F3A34" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
  * { box-sizing:border-box; }
  body { margin:0; background:#EDEAE2; font-family:'Noto Sans KR',sans-serif; display:flex; justify-content:center; }
  .serif { font-family:'Song Myung', serif; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  .app { width:100%; max-width:420px; min-height:100vh; background:#FAF8F3; box-shadow:0 0 40px rgba(0,0,0,0.06); display:flex; flex-direction:column; }
  .header { padding:32px 20px 16px; border-bottom:1px solid #E7E2D6; }
  .header .tag { font-size:10px; letter-spacing:.2em; color:#C9A15D; margin:0; }
  .header h1 { font-size:24px; margin:4px 0 0; color:#1F3A34; }
  .stagebar { display:flex; gap:4px; margin-top:12px; }
  .stagebar div { flex:1; height:4px; border-radius:999px; background:#E7E2D6; }
  .stagebar div.on { background:#1F3A34; }
  .stagelabel { font-size:10px; margin-top:6px; color:#A8A296; }
  .content { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; }
  .row.user { justify-content:flex-end; }
  .row.bot { justify-content:flex-start; }
  .bubble-wrap { max-width:85%; }
  .qlabel { display:flex; align-items:center; gap:4px; margin:0 0 4px 4px; font-size:9px; font-weight:600; letter-spacing:.05em; color:#C9A15D; }
  .bubble { border-radius:16px; padding:12px 16px; font-size:14px; line-height:1.6; }
  .bubble.user { background:#1F3A34; color:#FAF8F3; border-top-right-radius:4px; }
  .bubble.bot { background:#FFFFFF; color:#2A2E2C; border:1px solid #E7E2D6; border-top-left-radius:4px; }
  .bubble.error { background:#FBF0EE; color:#8A3B2E; border:1px solid #E9C9C1; }
  .typing { display:flex; gap:4px; padding:4px 2px; }
  .typing span { width:6px; height:6px; border-radius:50%; background:#C9A15D; opacity:.5; animation:blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay:.2s; }
  .typing span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.25;} 40%{opacity:1;} }
  .summary { border-radius:16px; padding:16px; background:#F1ECDD; border:1px solid #E3D9BE; margin-top:8px; }
  .summary .stitle { display:flex; align-items:center; gap:6px; margin-bottom:8px; font-size:12px; font-weight:600; color:#8A6D3B; }
  .summary p { font-size:12px; line-height:1.8; color:#5B5343; margin:0; }
  .inputbar { padding:8px 20px 16px; border-top:1px solid #E7E2D6; }
  .inputwrap { display:flex; align-items:center; gap:8px; border-radius:999px; padding:6px 6px 6px 16px; background:#FFFFFF; border:1px solid #E7E2D6; }
  .inputwrap input { flex:1; border:none; outline:none; font-size:14px; padding:8px 0; color:#2A2E2C; background:transparent; font-family:'Noto Sans KR',sans-serif; }
  .inputwrap input:disabled { color:#A8A296; }
  .sendbtn { width:36px; height:36px; border-radius:999px; border:none; display:flex; align-items:center; justify-content:center; background:#E7E2D6; color:#FAF8F3; cursor:pointer; flex-shrink:0; }
  .sendbtn.active { background:#1F3A34; cursor:pointer; }
  .sendbtn:disabled { cursor:not-allowed; }
  .donetext { text-align:center; font-size:11px; color:#A8A296; padding:8px 20px 24px; }
  .retrybar { padding:0 20px 16px; text-align:center; }
  .retrybtn { border:1px solid #1F3A34; background:#FFFFFF; color:#1F3A34; font-size:12px; padding:8px 16px; border-radius:999px; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <p class="tag mono">SELF COACHING</p>
    <h1 class="serif">오늘의 코칭</h1>
    <div class="stagebar" id="stagebar"></div>
    <p class="stagelabel" id="stagelabel">합의 단계</p>
  </div>
  <div class="content" id="content"></div>
  <div id="inputarea"></div>
</div>

<script>
// 실제 AI(Gemini) 응답은 브라우저가 직접 호출하지 않는다 — API 키 노출을 막기 위해
// Cloudflare Worker 프록시(kpc-coach-chat/worker/)를 거친다. 상세: worker/README.md
const WORKER_URL = "https://nada-company6-kpc-coach-chat.tossneon.workers.dev/chat";

const STAGE_LABEL = ["합의", "경청·반영", "강력한 질문", "알아차림", "실행 설계"];

let messages = [
  { role:"bot", text:"안녕하세요. 오늘은 어떤 주제를 다뤄보고 싶으세요?", isQuestion:true, stage:0 }
];
let stage = 0;
let summary = null;
let loading = false;
let lastFailedText = null; // 실패 시 재시도용으로 보관 (입력값을 잃지 않게)

async function askCoach(historyForApi){
  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ history: historyForApi })
  });
  if(!res.ok){
    let detail = "";
    try { detail = (await res.json()).error || ""; } catch(e) {}
    throw new Error(detail || `요청 실패 (HTTP ${res.status})`);
  }
  return res.json();
}

function render(){
  const bar = document.getElementById("stagebar");
  bar.innerHTML = STAGE_LABEL.map((_,i)=> `<div class="${i <= stage ? 'on':''}"></div>`).join("");
  document.getElementById("stagelabel").textContent = STAGE_LABEL[Math.min(stage,4)] + " 단계";

  const content = document.getElementById("content");
  content.innerHTML = messages.map(m => `
    <div class="row ${m.role}">
      <div class="bubble-wrap">
        ${m.role==="bot" && m.isQuestion ? `<div class="qlabel">❓ COACHING Q</div>` : ""}
        <div class="bubble ${m.role}${m.isError ? ' error' : ''}">${escapeHtml(m.text)}</div>
      </div>
    </div>
  `).join("")
  + (loading ? `
    <div class="row bot">
      <div class="bubble-wrap">
        <div class="bubble bot"><div class="typing"><span></span><span></span><span></span></div></div>
      </div>
    </div>` : "")
  + (summary ? `
    <div class="summary">
      <div class="stitle">✨ 세션 요약</div>
      <p><b>오늘 다룬 주제</b> · ${escapeHtml(summary.topic || "")}<br/><b>알아차린 것</b> · ${escapeHtml(summary.awareness || "")}<br/><b>이번 주 실행 약속</b> · ${escapeHtml(summary.action || "")}</p>
    </div>` : "");
  content.scrollTop = content.scrollHeight;

  const area = document.getElementById("inputarea");
  if(!summary){
    if(lastFailedText){
      area.innerHTML = `
        <div class="retrybar">
          <button class="retrybtn" id="retry-btn">다시 시도</button>
        </div>`;
      document.getElementById("retry-btn").addEventListener("click", () => sendText(lastFailedText, { isRetry:true }));
      return;
    }
    area.innerHTML = `
      <div class="inputbar">
        <div class="inputwrap">
          <input id="msg-input" placeholder="자유롭게 이야기해보세요" ${loading ? "disabled" : ""} />
          <button class="sendbtn" id="send-btn" ${loading ? "disabled" : ""}>➤</button>
        </div>
      </div>`;
    const input = document.getElementById("msg-input");
    input.addEventListener("keydown", e => { if(e.key==="Enter") send(); });
    input.addEventListener("input", () => {
      document.getElementById("send-btn").classList.toggle("active", input.value.trim().length>0);
    });
    document.getElementById("send-btn").addEventListener("click", send);
    if(!loading) input.focus();
  } else {
    area.innerHTML = `<div class="donetext">오늘 세션은 여기까지예요. 수고하셨어요.</div>`;
  }
}

function escapeHtml(text){
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;");
}

function send(){
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if(!text || summary || loading) return;
  sendText(text);
}

async function sendText(text, { isRetry=false } = {}){
  if(isRetry){
    // 직전 실패 시도(사용자 발화 + 에러 말풍선)를 지우고 다시 시작한다 —
    // 그래야 중복 발화나 에러 문구가 Gemini로 보내는 대화 기록에 섞이지 않는다.
    const last = messages[messages.length-1];
    const prev = messages[messages.length-2];
    if(last && last.isError && prev && prev.role === "user" && prev.text === text){
      messages.splice(messages.length-2, 2);
    }
  }
  lastFailedText = null;
  messages.push({ role:"user", text });
  loading = true;
  render();

  const historyForApi = messages.map(m => ({ role: m.role, text: m.text }));

  try {
    const reply = await askCoach(historyForApi);
    messages.push({
      role: "bot",
      text: reply.text,
      isQuestion: !!reply.isQuestion,
      stage: typeof reply.stage === "number" ? reply.stage : stage
    });
    stage = typeof reply.stage === "number" ? reply.stage : stage;
    if(reply.end){
      summary = reply.summary || null;
    }
  } catch (err) {
    // 사용자가 방금 한 말은 대화에 남겨두고, 재시도 버튼만 보여준다 — 입력을 잃지 않게 한다.
    messages.push({
      role: "bot",
      text: "코치가 잠시 응답하지 못했어요. 네트워크 상태를 확인하고 다시 시도해주세요.",
      isQuestion: false,
      isError: true
    });
    lastFailedText = text;
    console.error("kpc-coach-chat: askCoach failed", err);
  } finally {
    loading = false;
    render();
  }
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
