    <g fill="#DCEEFF" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="150" cy="160" rx="17" ry="14"/><ellipse cx="210" cy="160" rx="17" ry="14"/>
      <path d="M100,278 C72,278 60,222 70,172 C86,88 132,48 180,48 C228,48 274,88 290,172 C300,222 288,278 260,278 Z"/>
    </g>
  </g>
