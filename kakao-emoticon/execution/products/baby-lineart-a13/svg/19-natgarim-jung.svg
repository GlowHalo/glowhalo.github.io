  <circle cx="152" cy="150" r="7" fill="#2B2B2B"/><circle cx="208" cy="150" r="7" fill="#2B2B2B"/><path d="M148,160 C146,172 150,182 154,175 Z" fill="#7FD1E8"/><path d="M204,160 C202,172 206,182 210,175 Z" fill="#7FD1E8"/>
  <path d="M164,188 L196,188" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="132" cy="172" rx="11" ry="7" fill="#FF8FA3" opacity="0.6"/><ellipse cx="228" cy="172" rx="11" ry="7" fill="#FF8FA3" opacity="0.6"/>
  
  <text x="180" y="36" text-anchor="middle" font-family="Jua" font-size="30" fill="#2B2B2B" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">낯가림 중</text>
