  <circle cx="150" cy="136" r="11" fill="#2B2B2B"/><circle cx="210" cy="136" r="11" fill="#2B2B2B"/>
  <ellipse cx="180" cy="170" rx="11" ry="14" fill="#2B2B2B"/>
  <ellipse cx="134" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/><ellipse cx="226" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/>
  <path d="M300,66 L306,84 L324,90 L306,96 L300,114 L294,96 L276,90 L294,84 Z" fill="#FFD24C" stroke="#E8A800" stroke-width="2"/>
