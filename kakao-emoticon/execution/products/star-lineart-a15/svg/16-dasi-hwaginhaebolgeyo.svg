<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <defs>
    <filter id="dropshadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>
  <!-- 몸통·손: 따뜻한 노란빛 화이트로 채워서 다크모드 배경에서도 실루엣이 살아있게 함
       (A7에서 확립한 규칙 — fill:none 금지, 반드시 solid fill) -->
  <g filter="url(#dropshadow)">
    <g fill="#FFF4D6" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="265" cy="185" rx="18" ry="15"/><ellipse cx="205" cy="230" rx="15" ry="12" transform="rotate(30 205 230)"/>
      <path d="M180,42 C215,95 225,120 318,180 C225,240 215,265 180,318 C145,265 135,240 42,180 C135,120 145,95 180,42 Z"/>
    </g>
  </g>
  
  <circle cx="152" cy="138" r="7" fill="#2B2B2B"/><circle cx="208" cy="138" r="7" fill="#2B2B2B"/>
  <path d="M168,168 Q180,175 192,168" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="134" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/><ellipse cx="226" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/>
  
  <text x="180" y="30" text-anchor="middle" font-family="Jua" font-size="27" fill="#2B2B2B" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">다시</text><text x="180" y="55" text-anchor="middle" font-family="Jua" font-size="27" fill="#2B2B2B" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">확인해볼게요</text>
</svg>
