    <g fill="#FFF4D6" stroke="#2B2B2B" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">
      <ellipse cx="70" cy="190" rx="17" ry="14" transform="rotate(-20 70 190)"/><ellipse cx="290" cy="190" rx="17" ry="14" transform="rotate(20 290 190)"/>
      <path d="M180,42 C215,95 225,120 318,180 C225,240 215,265 180,318 C145,265 135,240 42,180 C135,120 145,95 180,42 Z"/>
    </g>
  </g>
  <path d="M132,118 Q144,108 156,116" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/><path d="M228,116 Q216,106 204,114" fill="none" stroke="#2B2B2B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="156" cy="138" r="7" fill="#2B2B2B"/><circle cx="212" cy="138" r="7" fill="#2B2B2B"/>
  <path d="M164,172 L196,172" fill="none" stroke="#2B2B2B" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="134" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/><ellipse cx="226" cy="158" rx="10" ry="6" fill="#FF8FA3" opacity="0.55"/>
  <text x="286" y="112" font-size="44" font-family="sans-serif" fill="#2B2B2B" font-weight="bold">?</text>
  <text x="180" y="30" text-anchor="middle" font-family="Jua" font-size="27" fill="#2B2B2B" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">방금 그 생각</text><text x="180" y="55" text-anchor="middle" font-family="Jua" font-size="27" fill="#2B2B2B" stroke="#ffffff" stroke-width="6" paint-order="stroke" stroke-linejoin="round">어디갔지</text>
</svg>
