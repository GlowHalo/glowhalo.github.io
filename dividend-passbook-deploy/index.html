const TODAY = new Date(new Date().toISOString().slice(0, 10));
const FX_USD_KRW = 1380;

function addMonths(date, n) { const d = new Date(date); d.setMonth(d.getMonth() + n); return d; }
function fmt(d) { return d.toISOString().slice(0, 10); }

function generateDividends({ startDate, freqMonths, baseAmount, annualGrowth, payLagDays, confirmWindowDays }) {
  const events = [];
  let d = new Date(startDate);
  const startYear = d.getFullYear();
  const endBound = addMonths(TODAY, 6);
  let guard = 0;
  while (d <= endBound && guard < 60) {
    const yearsElapsed = d.getFullYear() - startYear;
    const perShare = +(baseAmount * Math.pow(1 + annualGrowth, yearsElapsed)).toFixed(3);
    const payDate = new Date(d);
    payDate.setDate(payDate.getDate() + payLagDays);
    const daysToEx = (d - TODAY) / (1000 * 60 * 60 * 24);
    let status;
    if (d <= TODAY) status = "paid";
    else if (daysToEx <= confirmWindowDays) status = "confirmed";
    else status = "estimated";
    events.push({ exDate: fmt(d), payDate: fmt(payDate), perShare, status });
    d = addMonths(d, freqMonths);
    guard++;
  }
  return events;
}

// 실제 계좌에서 확인한 분배금(real)에 이어서, 그 평균 단가로 향후 몇 달치를
// "estimated"로 이어붙인다 — 커버드콜류처럼 금액이 매달 변동해서 공식으로
// 못 만드는 종목은 이 방식으로 "실제 확정분 + 추정 이어붙이기"만 가능하다.
function generateRealDividends({ real, freqMonths, payLagDays, projectMonths }) {
  const known = real.map((r) => ({ ...r, status: "paid" }));
  const avg = real.reduce((s, r) => s + r.perShare, 0) / real.length;
  const events = [...known];
  let d = addMonths(new Date(real[real.length - 1].exDate), freqMonths);
  const endBound = addMonths(TODAY, projectMonths || 6);
  let guard = 0;
  while (d <= endBound && guard < 24) {
    const payDate = new Date(d);
    payDate.setDate(payDate.getDate() + payLagDays);
    events.push({ exDate: fmt(d), payDate: fmt(payDate), perShare: +avg.toFixed(4), status: "estimated" });
    d = addMonths(d, freqMonths);
    guard++;
  }
  return events;
}

const CUSTOM_STOCKS_KEY = "dividend-passbook:customStocks:v1";
function loadCustomStocks() {

    return Array.isArray(parsed) ? parsed : null;
  } catch {

  }
}
function saveCustomStocks() {
  try {
    localStorage.setItem(CUSTOM_STOCKS_KEY, JSON.stringify(customStocks));
  } catch {}
}
let customStocks = loadCustomStocks() || [];

function getStock(tickerOrName) {
  return STOCKS.find((s) => s.ticker === tickerOrName)
    || customStocks.find((s) => s.ticker === tickerOrName || s.name === tickerOrName);
}
function isCustomStock(ticker) {
  return !STOCKS.find((s) => s.ticker === ticker) && !!customStocks.find((s) => s.ticker === ticker);
}
function getOrCreateCustomStock(ticker, name, currency) {
  let stock = getStock(ticker) || getStock(name);
  if (stock) return stock;
  stock = { ticker: ticker || name, name: name || ticker, market: currency === "KRW" ? "KR" : "US", currency: currency || "KRW", dividends: [] };
  customStocks.push(stock);
  saveCustomStocks();
  return stock;
}
function addCustomDividend(ticker, exDate, perShare) {
  const stock = getStock(ticker);
  if (!stock) return;
  stock.dividends.push({ exDate, payDate: exDate, perShare, status: "paid" });
  stock.dividends.sort((a, b) => a.exDate.localeCompare(b.exDate));
  saveCustomStocks();
  render();
}

  const dateVal = document.getElementById(`div-date-${holdingId}`).value;

}

function grossKRW(event, stock, qty) {
  const gross = event.perShare * qty;
  return stock.currency === "KRW" ? gross : gross * FX_USD_KRW;
}

// 매입금액(원금, 원화 환산) — 매입단가(price)를 입력한 보유분만 계산 가능
function costBasisKRW(h) {
  const stock = getStock(h.ticker);
  if (!stock || !h.price) return 0;
  const cost = h.price * h.quantity;
  return stock.currency === "KRW" ? cost : cost * FX_USD_KRW;
}

};
function classifyAmount(event, stock, qty, accountType) {
  const gross = grossKRW(event, stock, qty);
  if (accountType === "general") {
    const rate = stock.currency === "KRW" ? 0.154 : 0.15;
    return { gross, net: gross * (1 - rate), certain: true, taxNote: null };
  }
  return { gross, net: null, certain: false, taxNote: TAX_NOTE[accountType] };
}

/* ----------------------------- CSV 일괄 가져오기 (매수 배치·매도 이력 지원) ----------------------------- */
let csvImport = { open: false, fileName: "", headerError: null, results: [] };

const CSV_HEADER_ALIASES = {
  ticker: ["ticker", "종목코드", "티커", "코드"],
  name: ["name", "종목명", "상품명"],
  currency: ["currency", "통화"],
  quantity: ["quantity", "수량", "주식수"],
  price: ["price", "매입단가", "가격", "체결단가"],
  purchaseDate: ["purchasedate", "매입일", "매수일"],
  accountType: ["accounttype", "계좌유형", "계좌"],
  sellDate: ["selldate", "매도일"],
};
const ACCOUNT_TYPE_ALIASES = {
  general: ["general", "일반", "일반위탁"],
  isa: ["isa"],
  pension: ["pension", "연금", "연금저축", "irp", "연금저축·irp"],
};

function toggleCsvImport() { csvImport = { open: !csvImport.open, fileName: "", headerError: null, results: [] }; render(); }

function parseCSV(text) {
  const lines = text.split(/\r\n|\n|\r/).filter((l) => l.trim().length > 0);
  const parseLine = (line) => {
    const cells = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (inQuotes) {
        if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQuotes = false; }
        else cur += ch;
      } else {
        if (ch === '"') inQuotes = true;
        else if (ch === ",") { cells.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    cells.push(cur);
    return cells.map((c) => c.trim());
  };
  if (lines.length === 0) return { headers: [], rows: [] };
  return { headers: parseLine(lines[0]), rows: lines.slice(1).map(parseLine) };
}

function resolveHeaderIndex(headers) {
  const norm = headers.map((h) => h.toLowerCase().replace(/\s/g, ""));
  const idx = {};
  Object.entries(CSV_HEADER_ALIASES).forEach(([key, aliases]) => {
    idx[key] = norm.findIndex((h) => aliases.some((a) => a.toLowerCase() === h));
  });
  return idx;
}

function resolveAccountType(raw) {
  const norm = (raw || "").toLowerCase().replace(/\s/g, "");
  for (const [key, aliases] of Object.entries(ACCOUNT_TYPE_ALIASES)) {
    if (aliases.some((a) => a.toLowerCase() === norm)) return key;
  }
  return null;
}

function isValidDateStr(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s).getTime()); }

function validateCsvRow(cols, idx, rowNum) {
  const get = (key) => (idx[key] >= 0 ? (cols[idx[key]] || "").trim() : "");
  const tickerRaw = get("ticker");
  const nameRaw = get("name");
  const currencyRaw = get("currency").toUpperCase();
  const qtyRaw = get("quantity");
  const priceRaw = get("price");
  const dateRaw = get("purchaseDate");
  const accRaw = get("accountType");
  const sellRaw = get("sellDate");

  if (!tickerRaw && !nameRaw) return { ok: false, error: "종목코드와 종목명이 둘 다 비어있어요 (최소 하나는 필요)" };
  let resolvedTicker = tickerRaw && (getStock(tickerRaw.toUpperCase()) || getStock(tickerRaw)) ? (getStock(tickerRaw.toUpperCase()) || getStock(tickerRaw)).ticker : null;
  if (!resolvedTicker && nameRaw && getStock(nameRaw)) resolvedTicker = getStock(nameRaw).ticker;
  // 데모 10종목·기존 커스텀 종목에도 없으면, 종목명이 있는 한 새 커스텀 종목으로 등록 예정
  // (실제 생성은 확정(가져오기) 시점에만 — 미리보기 단계에서 취소해도 흔적이 안 남도록)
  let pendingCustomStock = null;
  if (!resolvedTicker) {
    if (!nameRaw) return { ok: false, error: `"${tickerRaw}"는 지원하지 않는 종목이에요 (종목명을 같이 적어주면 커스텀 종목으로 등록돼요)` };
    resolvedTicker = tickerRaw || nameRaw;
    pendingCustomStock = { ticker: resolvedTicker, name: nameRaw, currency: currencyRaw === "USD" ? "USD" : "KRW" };
  }

  const qty = Number(qtyRaw);
  if (!qtyRaw || !Number.isFinite(qty) || qty <= 0) return { ok: false, error: `수량이 올바르지 않아요 (${qtyRaw})` };

  let price = null;
  if (priceRaw) {
    price = Number(priceRaw);
    if (!Number.isFinite(price) || price <= 0) return { ok: false, error: `매입단가가 올바르지 않아요 (${priceRaw})` };
  }

  if (!isValidDateStr(dateRaw)) return { ok: false, error: `매입일 형식이 올바르지 않아요 (YYYY-MM-DD, "${dateRaw}")` };

  const accountType = accRaw ? resolveAccountType(accRaw) : "general";
  if (!accountType) return { ok: false, error: `계좌유형을 알 수 없어요 ("${accRaw}")` };

  let sellDate = null;
  if (sellRaw) {
    if (!isValidDateStr(sellRaw)) return { ok: false, error: `매도일 형식이 올바르지 않아요 (YYYY-MM-DD, "${sellRaw}")` };
    if (sellRaw < dateRaw) return { ok: false, error: "매도일이 매입일보다 빨라요" };
    sellDate = sellRaw;
  }

  return {
    ok: true,
    pendingCustomStock,
    holding: { id: Date.now() * 1000 + rowNum, ticker: resolvedTicker, quantity: qty, price, purchaseDate: dateRaw, sellDate, accountType },
  };
}

function handleCsvFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const { headers, rows } = parseCSV(String(reader.result || ""));
    const idx = resolveHeaderIndex(headers);
    if ((idx.ticker < 0 && idx.name < 0) || idx.quantity < 0 || idx.purchaseDate < 0) {
      csvImport = { open: true, fileName: file.name, headerError: "필수 컬럼(종목코드 또는 종목명 / 수량 / 매입일)을 찾을 수 없어요. 헤더명을 확인해주세요.", results: [] };
      render();
      return;
    }
    const results = rows.map((cols, i) => {
      const rowNum = i + 2;
      const v = validateCsvRow(cols, idx, rowNum);
      return { rowNum, raw: cols.join(", "), ...v };
    });
    csvImport = { open: true, fileName: file.name, headerError: null, results };
    render();
  };
  reader.readAsText(file, "UTF-8");
}

function confirmCsvImport() {
  const okResults = csvImport.results.filter((r) => r.ok);
  if (okResults.length === 0) return;
  okResults.forEach((r) => {
    if (r.pendingCustomStock) {
      getOrCreateCustomStock(r.pendingCustomStock.ticker, r.pendingCustomStock.name, r.pendingCustomStock.currency);
    }
  });
  holdings = holdings.concat(okResults.map((r) => r.holding));
  saveHoldings();
  csvImport = { open: false, fileName: "", headerError: null, results: [] };
  render();
}

/* ----------------------------- 계산 ----------------------------- */
function computeAll() {
  const allEvents = [];
  holdings.forEach((h) => {
    const stock = getStock(h.ticker);
    if (!stock) return;
    // 매도일 당일까지는 배당락일 기준 소유로 보고 배당 자격 유지, 그 다음날부터 제외
    stock.dividends.filter((e) => e.exDate >= h.purchaseDate && (!h.sellDate || e.exDate <= h.sellDate)).forEach((e) => {
      const c = classifyAmount(e, stock, h.quantity, h.accountType);
      allEvents.push({ ...e, holdingId: h.id, ticker: h.ticker, name: stock.name, market: stock.market,
        currency: stock.currency, qty: h.quantity, accountType: h.accountType,
        gross: c.gross, net: c.net, certain: c.certain, taxNote: c.taxNote });
    });
  });
  const paidEvents = allEvents.filter((e) => e.status === "paid").sort((a, b) => a.exDate.localeCompare(b.exDate));
  const confirmedEvents = allEvents.filter((e) => e.status === "confirmed").sort((a, b) => a.exDate.localeCompare(b.exDate));
  const estimatedEvents = allEvents.filter((e) => e.status === "estimated").sort((a, b) => a.exDate.localeCompare(b.exDate));
  const thisMonthEvents = [...paidEvents, ...confirmedEvents]
    .filter((e) => monthKey(e.exDate) === thisMonthKey || monthKey(e.payDate) === thisMonthKey)
    .sort((a, b) => a.exDate.localeCompare(b.exDate));

  const yearGross = paidEvents.filter((e) => e.exDate.slice(0, 4) === String(TODAY.getFullYear()) && e.accountType === "general")
    .reduce((s, e) => s + e.gross, 0);
  const generalNetAllTime = paidEvents.filter((e) => e.accountType === "general").reduce((s, e) => s + e.net, 0);
  const isaGrossAllTime = paidEvents.filter((e) => e.accountType === "isa").reduce((s, e) => s + e.gross, 0);
  const pensionGrossAllTime = paidEvents.filter((e) => e.accountType === "pension").reduce((s, e) => s + e.gross, 0);

  const ledgerAsc = [];
  let running = 0;
  paidEvents.forEach((e) => { running += e.gross; ledgerAsc.push({ ...e, running }); });
  const ledgerDesc = [...ledgerAsc].reverse();

  return { allEvents, paidEvents, confirmedEvents, estimatedEvents, thisMonthEvents, yearGross,
    generalNetAllTime, isaGrossAllTime, pensionGrossAllTime, ledgerDesc };
}

/* ----------------------------- 배당 탭: 최근 12개월(실제) + 다음달(추정) 13개월 분해 ----------------------------- */
// 연도 단위로 끊으면 올해 하반기처럼 아직 안 일어난 "추정" 달까지 연간 합계에 섞여
// 허무맹랑해지므로, 오늘 기준 과거로 굴러가는 실제 12개월 + 다음달 추정 1개월만 보여준다.
function trailing13Months(allEvents) {
  const months = [];
  for (let i = -11; i <= 1; i++) {
    const mKey = monthKey(fmt(addMonths(TODAY, i)));
    const events = allEvents.filter((e) => monthKey(e.exDate) === mKey);
    months.push({ month: mKey, value: events.reduce((s, e) => s + e.gross, 0), events, isFuture: i > 0 });
  }
  return months;
}

// 같은 종목의 매수 배치(구매기록)별로 흩어진 이벤트를 종목+배당락일 기준 한 줄로 합친다
// (배당락일 기준 보유수량만 반영되므로 그 시점에 실제로 들고 있던 주수의 합이 된다)
function mergeEventsByTicker(events) {
  const map = {};
  events.forEach((e) => {
    const key = `${e.ticker}__${e.exDate}`;
    if (!map[key]) {
      map[key] = { ticker: e.ticker, name: e.name, currency: e.currency, perShare: e.perShare,
        exDate: e.exDate, payDate: e.payDate, status: e.status, qty: 0, gross: 0, net: 0, allCertain: true, accountTypes: new Set(), taxNote: e.taxNote };
    }
    const m = map[key];
    m.qty += e.qty;
    m.gross += e.gross;
    if (e.certain) m.net += e.net; else m.allCertain = false;
    m.accountTypes.add(e.accountType);
  });
  return Object.values(map).map((m) => ({ ...m, accountTypes: Array.from(m.accountTypes) }));
}

/* ----------------------------- 수익 탭: 기간별 배당 합계 ----------------------------- */
function periodDividendTotal(period, paidEvents) {
  if (period === "total") return paidEvents.reduce((s, e) => s + e.gross, 0);
  if (period === "today") return paidEvents.filter((e) => e.exDate === fmt(TODAY)).reduce((s, e) => s + e.gross, 0);
  if (period === "week") {
    const start = new Date(TODAY);
    start.setDate(TODAY.getDate() - TODAY.getDay());
    return paidEvents.filter((e) => new Date(e.exDate) >= start).reduce((s, e) => s + e.gross, 0);
  }
  if (period === "month") return paidEvents.filter((e) => monthKey(e.exDate) === thisMonthKey).reduce((s, e) => s + e.gross, 0);
  if (period === "quarter") {
    const q = Math.floor(TODAY.getMonth() / 3);
    return paidEvents.filter((e) => {
      const d = new Date(e.exDate);
      return d.getFullYear() === TODAY.getFullYear() && Math.floor(d.getMonth() / 3) === q;
    }).reduce((s, e) => s + e.gross, 0);
  }
  if (period === "year") return paidEvents.filter((e) => e.exDate.slice(0, 4) === String(TODAY.getFullYear())).reduce((s, e) => s + e.gross, 0);
  return 0;
}

/* ----------------------------- 비중 탭: 매입금액(원금) 기준 그룹 ----------------------------- */
function costBasisGroups(holdingsList) {
  const byTicker = {}, byMarket = {}, byAccount = {};
  let total = 0;
  holdingsList.forEach((h) => {
    if (h.sellDate) return;
    const cost = costBasisKRW(h);
    if (!cost) return;
    const stock = getStock(h.ticker);
    if (!stock) return;
    if (!byTicker[h.ticker]) byTicker[h.ticker] = { key: h.ticker, label: stock.name, value: 0 };
    byTicker[h.ticker].value += cost;
    const marketLabel = stock.market === "KR" ? "국내" : "해외";
    byMarket[marketLabel] = (byMarket[marketLabel] || 0) + cost;
    const accLabel = getAccountType(h.accountType).label;
    byAccount[accLabel] = (byAccount[accLabel] || 0) + cost;
    total += cost;
  });
  const toList = (obj) => Object.entries(obj).map(([label, value]) => ({ key: label, label, value })).sort((a, b) => b.value - a.value);
  return {
    total,
    ticker: Object.values(byTicker).sort((a, b) => b.value - a.value),
    market: toList(byMarket),
    account: toList(byAccount),
    uncosted: holdingsList.filter((h) => !h.sellDate && !h.price).length,
  };
}

/* ----------------------------- 추이 탭: 원금(매입금액) 누적 추이 ----------------------------- */
function costBasisTrend(holdingsList) {
  const withCost = holdingsList.filter((h) => h.price).slice().sort((a, b) => a.purchaseDate.localeCompare(b.purchaseDate));
  const byMonth = {};
  let running = 0;
  withCost.forEach((h) => {
    running += costBasisKRW(h);
    byMonth[monthKey(h.purchaseDate)] = Math.round(running);
  });
  return Object.entries(byMonth).map(([m, v]) => ({ month: m, value: v }));
}

const wonCompact = (n) => (Math.abs(n) >= 10000 ? `${(n / 10000).toFixed(1)}만` : Math.round(n).toLocaleString("ko-KR"));

/* ----------------------------- 미니 차트(SVG) ----------------------------- */
function sparkline(chartData) {
  if (chartData.length < 2) return "";
  const w = 380, h = 70, pad = 4;
  const values = chartData.map((d) => d.value);
  const max = Math.max(...values), min = Math.min(...values, 0);
  const range = max - min || 1;
  const step = (w - pad * 2) / (chartData.length - 1);
  const pts = chartData.map((d, i) => {
    const x = pad + i * step;
    const y = h - pad - ((d.value - min) / range) * (h - pad * 2);
    return `${x},${y}`;
  });
  const areaPts = `${pad},${h - pad} ${pts.join(" ")} ${w - pad},${h - pad}`;
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${areaPts}" fill="#1F2A44" opacity="0.12"></polygon>
    <polyline points="${pts.join(" ")}" fill="none" stroke="#1F2A44" stroke-width="1.5"></polyline>
  </svg>`;
}

// 과거 8개월(지급완료, 남색) + 이번달(브라스) + 향후 3개월(추정치, 점선 테두리) 막대그래프
// 배당 탭용 13개월(최근 12개월 실제 + 다음달 추정) 막대그래프 — 막대 위 금액 라벨, 클릭 시 해당 월 선택, 추정월은 점선
function trailingBarChart(months, selectedMonthKey) {
  const w = 380, h = 116, pad = 4, labelH = 14;
  const max = Math.max(1, ...months.map((d) => d.value));
  const slot = (w - pad * 2) / months.length;
  const barW = slot * 0.6;
  const bars = months.map((d, i) => {
    const x = pad + i * slot + (slot - barW) / 2;
    const barH = Math.max(2, (d.value / max) * (h - pad - labelH - 12));
    const y = h - labelH - barH;
    const isSel = d.month === selectedMonthKey;
    const fill = isSel ? "#9C7A3C" : d.isFuture ? "#EDE9DC" : "#1F2A44";
    const stroke = d.isFuture ? ` stroke="#C9C0A5" stroke-width="1" stroke-dasharray="3,2"` : "";
    return `<g onclick="selectMonth('${d.month}')" style="cursor:pointer;">
      <rect x="${x.toFixed(1)}" y="${(pad).toFixed(1)}" width="${barW.toFixed(1)}" height="${(h - labelH - pad).toFixed(1)}" fill="transparent"></rect>
      ${d.value > 0 ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="7" fill="#8B93A8" text-anchor="middle" font-family="'IBM Plex Mono', monospace">${wonCompact(d.value)}</text>` : ""}
      <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" rx="2" fill="${fill}"${stroke}></rect>
      <text x="${(x + barW / 2).toFixed(1)}" y="${h - 3}" font-size="7" fill="${isSel ? "#9C7A3C" : "#8B93A8"}" font-weight="${isSel ? "700" : "400"}" text-anchor="middle" font-family="'IBM Plex Mono', monospace">${d.month.slice(5)}</text>
    </g>`;
  }).join("");
  return `<svg class="chart" style="height:116px;" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
}

// 비중 탭용 도넛 차트
const DONUT_COLORS = ["#1F2A44", "#9C7A3C", "#8B93A8", "#B23A3A", "#4B5670", "#C9C0A5"];
function donutChart(segments) {
  const size = 140, cx = size / 2, cy = size / 2, r = 50, strokeW = 22;
  const total = segments.reduce((s, seg) => s + seg.value, 0) || 1;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  const arcs = segments.map((seg, i) => {
    const dash = (seg.value / total) * circumference;
    const el = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${DONUT_COLORS[i % DONUT_COLORS.length]}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(1)} ${(circumference - dash).toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += dash;
    return el;
  }).join("");
  return `<svg viewBox="0 0 ${size} ${size}" style="width:140px; height:140px; display:block; margin:0 auto;">${arcs}</svg>`;
}

/* ----------------------------- 렌더 ----------------------------- */
function render() {
  const { allEvents, paidEvents, confirmedEvents, estimatedEvents, thisMonthEvents, yearGross,
    generalNetAllTime, isaGrossAllTime, pensionGrossAllTime, ledgerDesc } = computeAll();

  const THRESHOLD = 20000000;
  const pct = Math.min(100, (yearGross / THRESHOLD) * 100);

  // 도미노 벤치마킹 탭들이 쓰는 파생 데이터
  const trailingMonths = trailing13Months(allEvents);
  if (!trailingMonths.some((m) => m.month === selectedMonthKey)) selectedMonthKey = thisMonthKey;
  const selectedMonthData = trailingMonths.find((m) => m.month === selectedMonthKey);
  // "실제 데이터로만" — 추정월(다음달)을 뺀 최근 12개월의 실제 지급분만 합산
  const realTrailingEvents = trailingMonths.filter((m) => !m.isFuture).flatMap((m) => m.events).filter((e) => e.status === "paid");
  const trailing12Total = realTrailingEvents.reduce((s, e) => s + e.gross, 0);

  const costGroups = costBasisGroups(holdings);

    </div>

    <div class="card mt3">
      <span class="muted" style="font-size:12px; font-weight:500;">누적 투자 대비 배당 (전체 기간, 세전 기준)</span>
      <div class="mt2" style="display:flex; justify-content:space-between; text-align:center;">
        <div style="flex:1;">
          <div class="muted" style="font-size:10px;">총 투자원금</div>
          <div class="mono ink mt1" style="font-size:15px; font-weight:700;">${won(costGroups.total)}</div>
        </div>
        <div style="flex:1;">
          <div class="muted" style="font-size:10px;">누적 배당 수령액</div>
          <div class="mono brass mt1" style="font-size:15px; font-weight:700;">${won(totalDividendsAllTime)}</div>
        </div>
        <div style="flex:1;">
          <div class="muted" style="font-size:10px;">배당수익률</div>
          <div class="mono ink mt1" style="font-size:15px; font-weight:700;">${overallYieldPct === null ? "—" : overallYieldPct.toFixed(2) + "%"}</div>
        </div>
      </div>
      ${costGroups.uncosted > 0 ? `<p class="muted mt2" style="font-size:10px;">매입단가 미입력 ${costGroups.uncosted}건은 투자원금·수익률 계산에서 제외됐어요.</p>` : ""}
    </div>

    <div class="card mt3">
      <div class="row-between">
        <span class="ink" style="font-size:13px; font-weight:600;">${selectedMonthData.month}${selectedMonthData.isFuture ? " (예정)" : ""}</span>
        <span class="mono ink" style="font-size:14px; font-weight:600;">${won(selectedMonthData.value)}</span>
      </div>
      <div class="mt1">${monthListHtml}</div>
    </div>

    <div class="card mt3">
      <div class="row-between" style="margin-bottom:8px;">
        <span class="stamp" style="font-size:10px;">확정</span><span class="muted" style="font-size:11px;">이사회 결의 등으로 금액·일정이 정해진 배당</span>
      </div>
      ${confirmedHtml}
      <div class="row-between mt3" style="margin-bottom:8px;">
        <span style="font-size:10px; padding:2px 8px; border:1.5px solid #8B93A8; color:#8B93A8; border-radius:2px; font-weight:600; font-family:'IBM Plex Mono',monospace;">예상</span><span class="muted" style="font-size:11px;">과거 지급 패턴 기반 추정치</span>
      </div>
      ${estimatedHtml}
    </div>

    <div class="card mt3">
      <span class="muted" style="font-size:12px; font-weight:500;">전체 지급 기록 (누적)</span>
      <div class="ledger-header mt2"><span>거래일 / 종목·계좌</span><span>세전 수령액 / 누적</span></div>
      ${ledgerHtml}
      <div class="mt3" style="border-top:1px dashed #E4DCC5; padding-top:10px;">
        <div class="summary-line"><span class="muted">일반위탁 누적 (세후 확정)</span><span class="mono ink" style="font-weight:500;">${won(generalNetAllTime)}</span></div>
        <div class="summary-line"><span class="muted">ISA 누적 (세전, 만기 정산 예정)</span><span class="mono brass" style="font-weight:500;">${won(isaGrossAllTime)}</span></div>
        <div class="summary-line"><span class="muted">연금계좌 누적 (세전, 인출 시 정산 예정)</span><span class="mono brass" style="font-weight:500;">${won(pensionGrossAllTime)}</span></div>
      </div>
    </div>`;

  // --- 추이 ---
  const trendTabHtml = `
    <div class="card">
      <span class="muted" style="font-size:12px; font-weight:500;">투자 원금 추이</span>
      ${costTrendData.length > 1 ? `
        <div class="mt2">${sparkline(costTrendData)}</div>
        <div class="row-between mt1">
          <span class="muted" style="font-size:11px;">누적 매입원금</span>
          <span class="mono ink" style="font-size:14px; font-weight:600;">${won(costTrendData[costTrendData.length - 1].value)}</span>
        </div>` : `<p class="muted mt2" style="font-size:13px;">매입단가가 입력된 종목이 없어서 원금 추이를 계산할 수 없어요.</p>`}
    </div>
    <div class="footer-note mt3">
      "자산"(현재 평가금액) 라인은 종목 현재가가 있어야 계산되는데, 아직 실시간 시세 연동이 안 돼 있어요. 지금은 "원금"(매입금액 누적)만 보여드려요.
    </div>`;

  // --- 비중 ---
  const ALLOCATION_VIEWS = [
    { key: "ticker", label: "종목별", data: costGroups.ticker },
    { key: "market", label: "시장별", data: costGroups.market },
    { key: "account", label: "계좌별", data: costGroups.account },
  ];
  const currentAllocData = (ALLOCATION_VIEWS.find((v) => v.key === allocationView) || ALLOCATION_VIEWS[0]).data;
  const allocationTabHtml = `
    <div class="card">
      <div class="subtoggle">
        ${ALLOCATION_VIEWS.map((v) => `<button class="subtoggle-btn ${allocationView === v.key ? "active" : ""}" onclick="setAllocationView('${v.key}')">${v.label}</button>`).join("")}
      </div>
      ${costGroups.total === 0 ? `<p class="muted mt3" style="font-size:13px;">매입단가가 입력된 종목이 없어서 비중을 계산할 수 없어요.</p>` : `
        <div class="mt3">${donutChart(currentAllocData)}</div>
        <div class="mt3">${allocationListHtml(currentAllocData)}</div>
        <div class="row-between mt2" style="padding-top:8px; border-top:1px solid #EDE9DC;">
          <span class="muted" style="font-size:11px;">총 매입원금</span>
          <span class="mono ink" style="font-size:14px; font-weight:600;">${won(costGroups.total)}</span>
        </div>
        ${costGroups.uncosted > 0 ? `<p class="muted mt2" style="font-size:10px;">매입단가 미입력 ${costGroups.uncosted}건은 비중 계산에서 제외됐어요.</p>` : ""}`}
    </div>`;

  // --- 관리 (구 매수내역 탭 그대로) ---
  const manageTabHtml = `${addFormHtml}<div class="mt2">${csvImportHtml}</div><div class="mt3">${holdingsHtml}</div>`;

  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="header">
      <div class="header-tag">💼 DIVIDEND PASSBOOK</div>
      <h1 class="serif">배당통장</h1>
      <p>이경환님의 배당 기록 · 국내·해외 통합</p>
      <div class="perforation">${Array.from({ length: 30 }).map((_, i) => `<div style="background:${i % 2 === 0 ? "#1F2A44" : "transparent"};"></div>`).join("")}</div>
    </div>

    <div class="tabs mt6">
      <button class="tab-btn ${tab === "dividend" ? "active" : ""}" onclick="setTab('dividend')">배당</button>
      <button class="tab-btn ${tab === "profit" ? "active" : ""}" onclick="setTab('profit')">수익</button>
      <button class="tab-btn ${tab === "tax" ? "active" : ""}" onclick="setTab('tax')">세금</button>
      <button class="tab-btn ${tab === "trend" ? "active" : ""}" onclick="setTab('trend')">추이</button>
      <button class="tab-btn ${tab === "allocation" ? "active" : ""}" onclick="setTab('allocation')">비중</button>
      <button class="tab-btn ${tab === "manage" ? "active" : ""}" onclick="setTab('manage')">관리</button>
    </div>

    <div class="content">
      ${tab === "profit" ? profitTabHtml : ""}
      ${tab === "tax" ? taxTabHtml : ""}
      ${tab === "dividend" ? dividendTabHtml : ""}
      ${tab === "trend" ? trendTabHtml : ""}
      ${tab === "allocation" ? allocationTabHtml : ""}
      ${tab === "manage" ? manageTabHtml : ""}
    </div>

    <div class="footer-note">
      지금은 프로토타입 단계라 예시 종목·배당 데이터로 계산돼요. 실제 서비스에서는 증권사 계좌 연동과 실시간 시세로 자동 반영되고, 배당금·환율은 지급 시점에 따라 달라질 수 있어요. 모든 금액은 계좌와 무관하게 비교 가능하도록 세전 기준으로 표시하고, 세율이 고정된 일반위탁만 세후 확정 금액을 추가로 병기해요. ISA·연금저축·IRP는 최종 세액이 만기·인출 시점에 결정되므로 임의로 순액을 계산하지 않고 예상 세율 구간만 안내해요. 종합과세 여부는 다른 소득과 합산해 정확히 확인해 주세요.
    </div>
  `;
}

render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
