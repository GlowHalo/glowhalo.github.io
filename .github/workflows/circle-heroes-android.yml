name: Circle Heroes — Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - "**"
    paths:
      - "circle-heroes/**"
      - ".github/workflows/circle-heroes-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circle-heroes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web deps
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: circle-heroes/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: circle-heroes-debug-apk
          path: circle-heroes/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
