name: Circle Heroes — Android Release APK (서명)

on:
  # 스토어(Amazon Appstore, itch.io) 제출용 서명 릴리스 APK는 필요할 때만 수동 실행한다.
  # 아래 4개 repo secret이 등록돼 있어야 서명이 붙는다 — 없으면 그냥 실패한다(서명 안 된
  # APK를 실수로 스토어용인 것처럼 만들어내지 않기 위해 폴백을 두지 않음). 값은 금고
  # (circleheroes_release_keystore_base64 / circleheroes_keystore_password)에서 가져와
  # 아래 이름으로 이 저장소 Settings → Secrets and variables → Actions에 등록:
  #   CIRCLEHEROES_KEYSTORE_BASE64      ← circleheroes_release_keystore_base64 값 그대로
  #   CIRCLEHEROES_KEYSTORE_ALIAS       ← circleheroes_keystore_password JSON의 "alias"
  #   CIRCLEHEROES_KEYSTORE_STORE_PASSWORD ← 같은 JSON의 "storePassword"
  #   CIRCLEHEROES_KEYSTORE_KEY_PASSWORD   ← 같은 JSON의 "keyPassword" (PKCS12라 store와 동일)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circle-heroes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web deps
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Restore release keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.CIRCLEHEROES_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::CIRCLEHEROES_KEYSTORE_BASE64 시크릿이 등록되지 않았다 — 금고 circleheroes_release_keystore_base64 값을 이 이름으로 repo secret에 먼저 등록할 것"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/circleheroes-release.keystore

      - name: Build signed release APK
        working-directory: circle-heroes/android
        env:
          CIRCLEHEROES_RELEASE_KEYSTORE_PATH: circleheroes-release.keystore
          CIRCLEHEROES_KEYSTORE_ALIAS: ${{ secrets.CIRCLEHEROES_KEYSTORE_ALIAS }}
          CIRCLEHEROES_KEYSTORE_STORE_PASSWORD: ${{ secrets.CIRCLEHEROES_KEYSTORE_STORE_PASSWORD }}
          CIRCLEHEROES_KEYSTORE_KEY_PASSWORD: ${{ secrets.CIRCLEHEROES_KEYSTORE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove keystore from workspace
        if: always()
        run: rm -f circle-heroes/android/app/circleheroes-release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: circle-heroes-release-apk
          path: circle-heroes/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
